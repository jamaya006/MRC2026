      <button class="ac-btn ac-btn-secundario" data-marcar="E-1">Marcar cédula revisada</button>
      <span class="ac-marca-aud" data-marca-de="E-1"></span>
    </div>
  </section>

  <section class="ac-cedula" data-cedula="E-2">
    <div class="ac-cedula-encab">
      <span class="ref">E-2</span>
      <h3>KS y divergencia</h3>
    </div>
    <div class="ac-cedula-cuerpo">
      <p>El estadístico KS mide la máxima distancia entre la distribución acumulada de clientes buenos y la de malos a lo largo del puntaje. Responde dónde se separan más las dos poblaciones y cuánto.</p>
      <div class="ac-umbral"><strong>Rangos habituales de KS por tipo de modelo</strong>En modelos de admisión, valores entre 25 % y 35 % son normales. En modelos de comportamiento, donde hay historial interno del cliente, se esperan valores entre 35 % y 50 %. Un KS sobre 60 % en admisión debe verificarse antes de aceptarse. En divergencia, valores sobre 2 indican buena separación.</div>
      <div class="ac-nota"><strong>Por qué importa la distinción</strong>Un KS de 30 % es un buen resultado en admisión y un mal resultado en comportamiento. Evaluar ambos contra el mismo umbral es un error frecuente en informes de validación.</div>
      <div class="ac-nota"><strong>Procedimiento</strong>Antes de contrastar cualquier métrica contra un umbral, identificar de qué tipo de modelo se trata: admisión, comportamiento o cobranza. El umbral depende del tipo, y esa clasificación debe estar en la documentación del modelo.</div>
    </div>
    <div class="ac-cedula-pie">
      <button class="ac-btn ac-btn-secundario" data-marcar="E-2">Marcar cédula revisada</button>
      <span class="ac-marca-aud" data-marca-de="E-2"></span>
    </div>
  </section>

  <section class="ac-cedula" data-cedula="E-3">
    <div class="ac-cedula-encab">
      <span class="ref">E-3</span>
      <h3>Matriz de confusión y punto de corte</h3>
    </div>
    <div class="ac-cedula-cuerpo">
      <p>El modelo entrega una probabilidad. Para decidir hace falta un punto de corte. La matriz de confusión muestra las cuatro combinaciones posibles entre lo que el modelo predijo y lo que efectivamente ocurrió, para ese corte.</p>
      <table class="ac-tabla"><thead><tr><th></th><th>Incumplió</th><th>No incumplió</th></tr></thead><tbody><tr><td>Modelo rechaza</td><td>Acierto: pérdida evitada</td><td>Falso positivo: negocio perdido</td></tr><tr><td>Modelo aprueba</td><td>Falso negativo: pérdida asumida</td><td>Acierto: negocio bueno</td></tr></tbody></table>
      <p>Los dos errores no cuestan lo mismo. Un falso negativo cuesta la pérdida del crédito; un falso positivo cuesta el margen que se dejó de ganar. Como la pérdida suele ser varias veces el margen, el corte económicamente óptimo está bastante por debajo del 50 % que la intuición sugiere.</p>
      <div class="ac-umbral"><strong>Consecuencia práctica</strong>En carteras de consumo, con pérdida por operación incumplida muy superior al margen por operación sana, el corte óptimo suele ubicarse en torno al 10 % de probabilidad estimada, no al 50 %.</div>
      <div class="ac-riesgo"><strong>Qué sale mal</strong>Se reporta exactitud global como métrica principal. En una cartera con 3 % de incumplimiento, un modelo que aprueba todo tiene 97 % de exactitud y valor cero. La exactitud no es una métrica útil con clases desbalanceadas.</div>
      <div class="ac-nota"><strong>Procedimiento</strong>Solicitar la justificación económica del punto de corte vigente: costo asumido por falso negativo, margen perdido por falso positivo y fecha de la última revisión de esos supuestos.</div>
      <div data-widget="corte"></div>
    </div>
    <div class="ac-cedula-pie">
      <button class="ac-btn ac-btn-secundario" data-marcar="E-3">Marcar cédula revisada</button>
      <span class="ac-marca-aud" data-marca-de="E-3"></span>
    </div>
  </section>

  <section class="ac-cedula" data-cedula="E-4">
    <div class="ac-cedula-encab">
      <span class="ref">E-4</span>
      <h3>Modelos de estimación: cuando la salida no es una probabilidad</h3>
    </div>
    <div class="ac-cedula-cuerpo">
      <p>No todos los modelos de riesgo predicen un evento binario. Los modelos de estimación de renta, por ejemplo, predicen un monto, y ahí no aplican ROC ni KS. Se evalúan comparando el valor estimado contra el valor real.</p>
      <p>La herramienta habitual es el gráfico de contorno de valor real contra valor estimado. Un modelo que funciona concentra la masa de puntos alrededor de la diagonal. Las desviaciones sistemáticas por sobre o por debajo de esa diagonal son sesgo, no dispersión.</p>
      <ul><li>Nube concentrada sobre la diagonal: el modelo estima bien en ese rango.</li><li>Nube desplazada hacia arriba en los tramos bajos: el modelo sobreestima a los clientes de menor renta.</li><li>Nube que se abre en los extremos: el modelo pierde precisión donde hay menos observaciones.</li><li>Diferencias entre el contorno de entrenamiento y el de prueba: sobreajuste.</li></ul>
      <div class="ac-riesgo"><strong>Por qué importa para la provisión</strong>Si la renta estimada alimenta el cálculo de capacidad de pago, un sesgo sistemático de sobreestimación en los tramos bajos produce aprobaciones a clientes cuya capacidad real es menor. El efecto aparece después, en la morosidad de ese segmento.</div>
      <div class="ac-nota"><strong>Procedimiento</strong>Pedir los gráficos de contorno de entrenamiento y de prueba por segmento y compararlos. Si solo se entrega el de entrenamiento, el desempeño no está acreditado.</div>
    </div>
    <div class="ac-cedula-pie">
      <button class="ac-btn ac-btn-secundario" data-marcar="E-4">Marcar cédula revisada</button>
      <span class="ac-marca-aud" data-marca-de="E-4"></span>
    </div>
  </section>

  <section class="ac-cedula" data-cedula="E-5">
    <div class="ac-cedula-encab">
      <span class="ref">E-5</span>
      <h3>Calibración: el desempeño que casi nunca se revisa</h3>
    </div>
    <div class="ac-cedula-cuerpo">
      <p>Discriminar y calibrar son cosas distintas. Un modelo discrimina bien si ordena correctamente. Calibra bien si el nivel de la probabilidad estimada coincide con la frecuencia observada. Un modelo puede ordenar impecablemente y estimar mal el nivel.</p>
      <p>Para la provisión, la calibración es lo determinante. La probabilidad de incumplimiento entra directamente en el cálculo de la pérdida esperada. Si el modelo estima 2 % donde se observa 5 %, la provisión queda subestimada aunque el área bajo la curva sea excelente.</p>
      <table class="ac-tabla"><thead><tr><th>Tramo de PD estimada</th><th>PD promedio estimada</th><th>Incumplimiento observado</th><th>Desvío</th></tr></thead><tbody><tr><td>Muy bajo</td><td class="num">0,8 %</td><td class="num">0,9 %</td><td>Aceptable</td></tr><tr><td>Bajo</td><td class="num">2,1 %</td><td class="num">3,4 %</td><td>Subestima</td></tr><tr><td>Medio</td><td class="num">6,5 %</td><td class="num">9,8 %</td><td>Subestima</td></tr><tr><td>Alto</td><td class="num">18,0 %</td><td class="num">17,2 %</td><td>Aceptable</td></tr></tbody></table>
      <div class="ac-nota"><strong>Procedimiento</strong>Solicitar la tabla de PD estimada contra incumplimiento observado por tramo, sobre una ventana cerrada. Es la prueba directa de que la provisión está bien dimensionada y frecuentemente no forma parte del informe de desempeño.</div>
      <div class="ac-riesgo"><strong>Qué sale mal</strong>El informe de validación presenta solo métricas de discriminación. Se concluye que el modelo es bueno y no se verificó lo único que afecta directamente la cifra contable.</div>
    </div>
    <div class="ac-cedula-pie">
      <button class="ac-btn ac-btn-secundario" data-marcar="E-5">Marcar cédula revisada</button>
      <span class="ac-marca-aud" data-marca-de="E-5"></span>
    </div>
  </section>

  <section class="ac-cedula" data-cedula="E-6">
    <div class="ac-cedula-encab">
      <span class="ref">E-6</span>
      <h3>Laboratorio: desempeño, corte y calibración</h3>
    </div>
    <div class="ac-cedula-cuerpo">
      <p>Tres bloques que producen la cédula de desempeño completa. Se parte de un modelo ya entrenado, como el del módulo anterior.</p>
      <div class="ac-codigo"><div class="ac-codigo-encab"><span>Python</span><em>Paso 1. Las métricas de discriminación</em></div><pre><code>from sklearn.metrics import roc_curve, roc_auc_score

p = modelo.predict_proba(X_val)[:, 1]
fpr, tpr, cortes = roc_curve(y_val, p)

auc = roc_auc_score(y_val, p)
print(f"AUC   {auc:.3f}")
print(f"Gini  {2 * auc - 1:.3f}")
print(f"KS    {(tpr - fpr).max():.1%}")</code></pre></div>
      <p>roc_curve devuelve tres listas: la tasa de falsos positivos, la de verdaderos positivos y los cortes que las producen. El KS es la mayor distancia entre esas dos tasas. El Gini sale del AUC con una fórmula, así que son la misma medida y no dos evidencias separadas.</p>
      <div class="ac-codigo"><div class="ac-codigo-encab"><span>Python</span><em>Paso 2. El corte que minimiza el costo</em></div><pre><code>import numpy as np

PERDIDA, MARGEN = 1.00, 0.12

rejilla = np.arange(0.01, 0.51, 0.01)
costo = [((y_val == 1) &amp; (p &lt; c)).sum() * PERDIDA +
         ((y_val == 0) &amp; (p &gt;= c)).sum() * MARGEN for c in rejilla]

print(f"Corte de mínimo costo: {rejilla[int(np.argmin(costo))]:.0%}")</code></pre></div>
      <p>Se prueba cada corte del 1 % al 50 % y se calcula qué cuesta: los que incumplieron y fueron aprobados, más los sanos que fueron rechazados. argmin devuelve la posición del menor costo. Es exactamente lo que hacía el simulador.</p>
      <div class="ac-codigo"><div class="ac-codigo-encab"><span>Python</span><em>Paso 3. Calibración, la evidencia que sostiene la provisión</em></div><pre><code>cal = pd.DataFrame({"pd_estimada": p, "observado": y_val.values})
cal["tramo"] = pd.qcut(cal["pd_estimada"], 5)

tabla = cal.groupby("tramo", observed=True).agg(
    pd_estimada=("pd_estimada", "mean"),
    observado=("observado", "mean"))
tabla["desvio"] = tabla["observado"] - tabla["pd_estimada"]
print(tabla.round(4))</code></pre></div>
      <div class="ac-nota"><strong>Qué se busca en esa tabla</strong>Que las dos columnas se parezcan. Si el desvío es positivo en todos los tramos, el modelo subestima de forma sistemática y la provisión queda corta. Ninguna métrica de discriminación detecta eso.</div>
    </div>

      <span class="ac-marca-aud" data-marca-de="E-6"></span>
    </div>
  </section>

  <div class="ac-avance">

  <div class="ac-nota" style="margin-bottom:var(--e-6)">
    <strong>Qué se lleva de este módulo</strong>Detectar el deterioro de un modelo que sigue operando. Es el módulo que sostiene el encargo recurrente: un modelo aprobado hace tres años puede estar produciendo hoy una provisión que ya no corresponde.
  </div>

  <section class="ac-cedula" data-cedula="F-1">
    <div class="ac-cedula-encab">
      <span class="ref">F-1</span>
      <h3>Tres formas de validar y para qué sirve cada una</h3>
    </div>
    <div class="ac-cedula-cuerpo">
      <p>Un modelo se evalúa sobre distintas muestras, y cada una responde una pregunta diferente. Confundirlas es la causa de que un modelo aprobado se deteriore sin que nadie lo advierta.</p>
      <table class="ac-tabla"><thead><tr><th>Muestra</th><th>Qué responde</th><th>Qué no detecta</th></tr></thead><tbody><tr><td>Desarrollo</td><td>Si el modelo aprendió</td><td>Nada sobre generalización</td></tr><tr><td>Validación</td><td>Si generaliza a otros clientes del mismo período</td><td>Cambios en el tiempo</td></tr><tr><td>Fuera de tiempo</td><td>Si sigue vigente en un período posterior</td><td>—</td></tr></tbody></table>
      <blockquote class="ac-cita">Hay diferentes formas de hacer este corte de datos: algunos ocupan tres, entrenamiento, prueba y validación, y lo hacen 60, 20 y 20; en este caso vamos a ocupar 80 y 20.<cite>Clase 3, aprox. 01:50:24</cite></blockquote>
      <div class="ac-riesgo"><strong>Qué sale mal</strong>La partición se hace al azar sobre todo el histórico. Clientes del mismo período quedan en ambas muestras y la validación no prueba nada sobre el paso del tiempo. Es el error más común y el más fácil de detectar.</div>
      <div class="ac-nota"><strong>Procedimiento</strong>Solicitar las fechas mínima y máxima de cada muestra. Si los rangos se solapan por completo, no existe validación fuera de tiempo, sin importar cómo se llame el apartado del informe.</div>
    </div>
    <div class="ac-cedula-pie">
      <button class="ac-btn ac-btn-secundario" data-marcar="F-1">Marcar cédula revisada</button>
      <span class="ac-marca-aud" data-marca-de="F-1"></span>
    </div>
  </section>

  <section class="ac-cedula" data-cedula="F-2">
    <div class="ac-cedula-encab">
      <span class="ref">F-2</span>
      <h3>PSI: cómo se calcula y qué significa</h3>
    </div>
    <div class="ac-cedula-cuerpo">
      <p>El índice de estabilidad poblacional compara la distribución de una variable o del puntaje entre el período en que se construyó el modelo y el período actual. No mide desempeño: mide si la población sigue siendo la misma.</p>
      <p>Se calcula por tramo. Para cada uno se toma la diferencia entre el porcentaje actual y el de referencia, se multiplica por el logaritmo de su razón, y se suman los tramos.</p>
      <table class="ac-tabla"><thead><tr><th>Tramo de puntaje</th><th>% referencia</th><th>% actual</th><th>Aporte al PSI</th></tr></thead><tbody><tr><td>Bajo 400</td><td class="num">8,0 %</td><td class="num">14,0 %</td><td class="num">0,0336</td></tr><tr><td>400 a 500</td><td class="num">17,0 %</td><td class="num">21,0 %</td><td class="num">0,0085</td></tr><tr><td>500 a 600</td><td class="num">31,0 %</td><td class="num">29,0 %</td><td class="num">0,0013</td></tr><tr><td>600 a 700</td><td class="num">28,0 %</td><td class="num">24,0 %</td><td class="num">0,0062</td></tr><tr><td>Sobre 700</td><td class="num">16,0 %</td><td class="num">12,0 %</td><td class="num">0,0115</td></tr><tr><td>Total</td><td class="num">100 %</td><td class="num">100 %</td><td class="num">0,0611</td></tr></tbody></table>
      <div class="ac-umbral"><strong>Interpretación del PSI</strong>Bajo 0,10 la población es estable. Entre 0,10 y 0,25 hay desplazamiento moderado que exige análisis. Sobre 0,25 el desplazamiento es relevante y el modelo debe revisarse formalmente.</div>
      <div class="ac-nota"><strong>Qué mirar además del total</strong>El PSI total puede ser bajo mientras dos tramos se compensan entre sí. Revisar siempre el aporte por tramo, no solo la suma.</div>
      <div data-widget="psi"></div>
    </div>
    <div class="ac-cedula-pie">
      <button class="ac-btn ac-btn-secundario" data-marcar="F-2">Marcar cédula revisada</button>
      <span class="ac-marca-aud" data-marca-de="F-2"></span>
    </div>
  </section>

  <section class="ac-cedula" data-cedula="F-3">
    <div class="ac-cedula-encab">
      <span class="ref">F-3</span>
      <h3>PSI de la población y de las variables</h3>
    </div>
    <div class="ac-cedula-cuerpo">
      <p>El PSI se aplica sobre el puntaje final y también sobre cada variable de entrada. Cuando se calcula sobre las variables suele llamarse índice de estabilidad de características. La combinación de ambos identifica el origen del problema.</p>
      <table class="ac-tabla"><thead><tr><th>PSI del puntaje</th><th>PSI de variables</th><th>Diagnóstico</th></tr></thead><tbody><tr><td>Bajo</td><td>Bajo</td><td>Población estable</td></tr><tr><td>Bajo</td><td>Alto en algunas</td><td>Cambios que se compensan; revisar igualmente</td></tr><tr><td>Alto</td><td>Alto en pocas</td><td>Origen identificado en esas variables</td></tr><tr><td>Alto</td><td>Bajo en todas</td><td>Revisar integridad del cálculo o cambio de política</td></tr></tbody></table>
      <div class="ac-riesgo"><strong>Qué sale mal</strong>Se monitorea solo el puntaje. Una variable cambia de definición en el sistema de origen, el resto compensa y el puntaje se ve estable mientras el modelo ya opera sobre datos distintos de los que se construyó.</div>
      <div class="ac-nota"><strong>Procedimiento</strong>Solicitar el PSI por variable del último ciclo de monitoreo. Si no existe, la institución no está en condiciones de identificar la causa de un deterioro cuando ocurra.</div>
    </div>
    <div class="ac-cedula-pie">
      <button class="ac-btn ac-btn-secundario" data-marcar="F-3">Marcar cédula revisada</button>
      <span class="ac-marca-aud" data-marca-de="F-3"></span>
    </div>
  </section>

  <section class="ac-cedula" data-cedula="F-4">
    <div class="ac-cedula-encab">
      <span class="ref">F-4</span>
      <h3>Ventanas contaminadas: el caso de la pandemia</h3>
    </div>
    <div class="ac-cedula-cuerpo">
      <p>La estabilidad supone que el período de referencia es representativo. Cuando la ventana de observación o de desempeño abarca un episodio excepcional, esa suposición no se cumple y todas las métricas construidas sobre ella quedan condicionadas.</p>
      <p>Durante los años de pandemia coexistieron ayudas estatales, reprogramaciones masivas y suspensión de cobranza. El resultado fue morosidad artificialmente baja. Un modelo construido con esa ventana aprende un comportamiento de pago que no se repite en condiciones normales.</p>
      <div class="ac-riesgo"><strong>Cómo se manifiesta</strong>El modelo subestima la probabilidad de incumplimiento de manera sistemática. La discriminación puede seguir siendo buena, porque el orden entre clientes se mantiene, mientras el nivel de la provisión queda por debajo del riesgo real.</div>
      <div class="ac-umbral"><strong>Preguntas obligatorias sobre la ventana</strong>Qué período cubre la ventana de observación, qué período la de desempeño, si alguno abarca episodios excepcionales, y qué tratamiento se dio a las operaciones reprogramadas durante esos meses.</div>
      <div class="ac-nota"><strong>Procedimiento</strong>Contrastar la tasa de incumplimiento del período de construcción contra la de los períodos anterior y posterior. Una diferencia relevante sin explicación documentada es un hallazgo con efecto directo sobre la suficiencia de la provisión.</div>
    </div>
    <div class="ac-cedula-pie">
      <button class="ac-btn ac-btn-secundario" data-marcar="F-4">Marcar cédula revisada</button>
      <span class="ac-marca-aud" data-marca-de="F-4"></span>
    </div>
  </section>

  <section class="ac-cedula" data-cedula="F-5">
    <div class="ac-cedula-encab">
      <span class="ref">F-5</span>
      <h3>Monitoreo: la política que casi nunca existe</h3>
    </div>
    <div class="ac-cedula-cuerpo">
      <p>Un modelo no se valida una vez. La institución debe tener definido con qué frecuencia se mide, qué umbrales disparan una acción y quién decide. Sin eso, el monitoreo se convierte en un informe que nadie usa.</p>
      <table class="ac-tabla"><thead><tr><th>Indicador</th><th>Frecuencia mínima</th><th>Umbral de acción</th></tr></thead><tbody><tr><td>PSI del puntaje</td><td>Mensual</td><td>Sobre 0,25</td></tr><tr><td>PSI por variable</td><td>Trimestral</td><td>Sobre 0,25 en cualquier variable</td></tr><tr><td>Área bajo la curva fuera de tiempo</td><td>Semestral</td><td>Caída sobre 5 puntos</td></tr><tr><td>PD estimada contra observada</td><td>Anual</td><td>Desvío sistemático por tramo</td></tr><tr><td>Tasa de aprobación</td><td>Mensual</td><td>Variación sin cambio de política</td></tr></tbody></table>
      <div class="ac-riesgo"><strong>Qué sale mal</strong>El monitoreo existe, arroja PSI sobre 0,25 durante cuatro trimestres seguidos y no hay evidencia de acción. La deficiencia no es de medición sino de gobierno: la institución sabía y no actuó.</div>
      <div class="ac-nota"><strong>Entregable de este módulo</strong>La plantilla de monitoreo con los cinco indicadores, sus umbrales y el responsable de cada uno. Es directamente reutilizable en encargos y es lo primero que se solicita al revisar el gobierno de modelos.</div>
    </div>

      <span class="ac-marca-aud" data-marca-de="F-5"></span>
    </div>
  </section>

  <section class="ac-cedula" data-cedula="F-6">
    <div class="ac-cedula-encab">
      <span class="ref">F-6</span>
      <h3>Laboratorio: la función de PSI</h3>
    </div>
    <div class="ac-cedula-cuerpo">
      <p>Este es el entregable más reutilizable del programa. Se construye por partes y al final queda una función aplicable a cualquier extracción de cliente.</p>
      <div class="ac-codigo"><div class="ac-codigo-encab"><span>Python</span><em>Paso 1. Repartir las dos poblaciones en los mismos tramos</em></div><pre><code>import numpy as np

cortes = np.percentile(score_construccion, np.linspace(0, 100, 11))
cortes[0], cortes[-1] = -np.inf, np.inf

ref = np.histogram(score_construccion, cortes)[0] / len(score_construccion)
act = np.histogram(score_actual, cortes)[0] / len(score_actual)

print(ref.round(3))
print(act.round(3))</code></pre></div>
      <p>Los cortes salen de los percentiles del período de construcción: es esa distribución la que define la grilla, no la actual. Las dos últimas líneas cuentan qué proporción de cada población cae en cada tramo. Compáralas a ojo antes de calcular nada.</p>
      <div class="ac-codigo"><div class="ac-codigo-encab"><span>Python</span><em>Paso 2. El cálculo, que es una resta y un logaritmo</em></div><pre><code>aporte = (act - ref) * np.log(act / ref)
psi = aporte.sum()

print(f"PSI = {psi:.4f}")
print("estable" if psi &lt; 0.10 else "moderado" if psi &lt; 0.25 else "REVISAR EL MODELO")</code></pre></div>
      <p>Cada tramo aporta su diferencia multiplicada por el logaritmo de su razón, y el PSI es la suma. Los umbrales de 0,10 y 0,25 son los de la cédula F-2.</p>
      <div class="ac-codigo"><div class="ac-codigo-encab"><span>Python</span><em>Paso 3. Guardarlo como función para volver a usarlo</em></div><pre><code>def psi_de(referencia, actual, tramos=10):
    cortes = np.percentile(referencia, np.linspace(0, 100, tramos + 1))
    cortes[0], cortes[-1] = -np.inf, np.inf
    r = np.histogram(referencia, cortes)[0] / len(referencia)
    a = np.histogram(actual, cortes)[0] / len(actual)
    r, a = np.clip(r, 1e-6, None), np.clip(a, 1e-6, None)
    return float(((a - r) * np.log(a / r)).sum())</code></pre></div>
      <p>Una función es un bloque al que se le pone nombre para no repetirlo. def la define, y desde ahí se llama con psi_de(...) cuantas veces haga falta. clip evita el logaritmo de cero cuando un tramo queda vacío.</p>
      <div class="ac-codigo"><div class="ac-codigo-encab"><span>Python</span><em>El uso que va al papel de trabajo</em></div><pre><code>for v in ["score", "antiguedad_meses", "carga_financiera", "renta"]:
    valor = psi_de(desarrollo[v], actual[v])
    print(f"{v:&lt;22} PSI {valor:.4f}" + ("   &lt;-- REVISAR" if valor &gt; 0.25 else ""))</code></pre></div>
      <div class="ac-nota"><strong>Por qué se mide también cada variable</strong>El PSI del puntaje puede salir bajo mientras una variable de entrada cambió por completo y otras la compensaron. Es la situación de la cédula F-3, y solo se detecta midiendo variable por variable.</div>
    </div>

  <section class="ac-cedula" data-cedula="G-1">

      <h3>Qué es una provisión y por qué existe</h3>
    </div>
    <div class="ac-cedula-cuerpo">
      <p>La provisión por riesgo de crédito es la reserva que constituye una institución financiera para cubrir las pérdidas potenciales derivadas del incumplimiento de sus clientes. No es efectivo apartado: es un pasivo que reconoce una obligación probable.</p>
      <blockquote class="ac-cita">Es la reserva que tienen las instituciones financieras para cubrir las potenciales pérdidas que se provocan por incumplimiento de contratos con los clientes.<cite>Clase 6, aprox. 00:00:19</cite></blockquote>
      <p>La analogía que ordena el concepto para un contador es la depreciación. Un activo se deteriora y ese deterioro se reconoce para que los libros muestren el valor real del activo. La cartera de créditos es un activo, y la provisión es el reconocimiento de su deterioro.</p>
      <blockquote class="ac-cita">Como cualquier activo, para mí la provisión es el concepto del deterioro de ese activo, como hablar de una depreciación: para tener en los libros el valor real de ese activo.<cite>Clase 6, aprox. 00:09:08</cite></blockquote>
      <div class="ac-nota"><strong>Consecuencia para la auditoría</strong>Si la cartera tiene más probabilidad de impago, la provisión debe ser mayor. La pregunta de auditoría no es si la provisión existe, sino si su magnitud corresponde al riesgo efectivo de la cartera en la fecha de cierre.</div>

      <h3>Los tres parámetros y la fórmula</h3>
    </div>
    <div class="ac-cedula-cuerpo">
      <p>La pérdida esperada se compone de tres parámetros. Cada uno proviene de un modelo distinto, con datos, supuestos y responsables distintos. Revisarlos como un solo bloque es el error de enfoque más frecuente.</p>
      <table class="ac-tabla"><thead><tr><th>Parámetro</th><th>Qué estima</th><th>Origen habitual del dato</th></tr></thead><tbody><tr><td>PD</td><td>Probabilidad de que el cliente incumpla</td><td>Modelo de score o matriz de transición</td></tr><tr><td>LGD</td><td>Porcentaje de la exposición que no se recupera</td><td>Historia de recuperación y garantías</td></tr><tr><td>EAD</td><td>Exposición al momento del incumplimiento</td><td>Saldo más factores de conversión del contingente</td></tr></tbody></table>
      <p>La pérdida esperada de una operación es el producto de los tres. Como es un producto, un error en cualquiera de ellos se traslada íntegro al resultado: un 20 % de error en la LGD produce un 20 % de error en la provisión, cualquiera sea la calidad del modelo de PD.</p>
      <blockquote class="ac-cita">Es poco común que el criterio prospectivo se aplique sobre la EAD, porque la EAD corresponde básicamente a los factores del contingente.<cite>Clase 8, aprox. 00:01:54</cite></blockquote>

      <div class="ac-nota"><strong>Procedimiento</strong>Solicitar por separado la documentación de PD, LGD y EAD. Registrar cuál de las tres carece de metodología formal. Habitualmente es la LGD, y ahí suele estar el mayor riesgo no cubierto.</div>

    <div class="ac-cedula-cuerpo">
      <p>El marco de pérdida esperada clasifica las operaciones en tres etapas según haya o no aumento significativo del riesgo desde el reconocimiento inicial. La etapa determina el horizonte sobre el que se estima la pérdida.</p>
      <table class="ac-tabla"><thead><tr><th>Etapa</th><th>Situación</th><th>Horizonte de la pérdida esperada</th></tr></thead><tbody><tr><td class="num">1</td><td>Sin aumento significativo del riesgo</td><td>Doce meses</td></tr><tr><td class="num">2</td><td>Aumento significativo, sin deterioro crediticio</td><td>Toda la vida del instrumento</td></tr><tr><td class="num">3</td><td>Con deterioro crediticio</td><td>Toda la vida, con interés sobre saldo neto</td></tr></tbody></table>
      <p>El paso de etapa 1 a etapa 2 multiplica la provisión de una operación, porque cambia el horizonte. Por eso el criterio de aumento significativo del riesgo es una de las definiciones con mayor efecto sobre la cifra y una de las menos formalizadas.</p>
      <div class="ac-riesgo"><strong>Qué sale mal</strong>El criterio de traspaso está definido de forma cualitativa o depende de un umbral que se puede ajustar sin cambiar la metodología documentada. Mover ese umbral mueve la provisión sin que aparezca como cambio de política contable.</div>
      <div class="ac-nota"><strong>Procedimiento</strong>Obtener el criterio cuantitativo de traspaso entre etapas, verificar que está aprobado formalmente y recalcular la distribución de la cartera por etapa aplicándolo sobre una muestra. Documentar cualquier diferencia contra el reporte.</div>

    <div class="ac-cedula-cuerpo">
      <p>El marco exige incorporar información prospectiva: la estimación no puede basarse solo en lo observado, debe considerar condiciones futuras esperadas. En la práctica esto se traduce en proyectar los parámetros según escenarios macroeconómicos.</p>
      <blockquote class="ac-cita">Se busca que se tomen los criterios prospectivos tanto en la probabilidad de incumplimiento como en la LGD. El criterio es que usted debe proyectar.<cite>Clase 8, aprox. 00:02:42</cite></blockquote>

      <div class="ac-riesgo"><strong>El ajuste de la administración</strong>Es la diferencia entre lo que el modelo calcula y lo que finalmente se contabiliza. Puede estar justificado, por ejemplo cuando el modelo no captura un riesgo reciente. Pero debe estar cuantificado, fundamentado y aprobado, y debe conciliar con el mayor.</div>
      <div class="ac-umbral"><strong>Prueba mínima de conciliación</strong>La suma de la provisión por operación del motor de cálculo debe conciliar con el saldo del mayor. Toda diferencia debe estar explicada línea por línea. Una diferencia sin explicación es un hallazgo, aunque su monto sea inmaterial: revela que el control de conciliación no opera.</div>

      <div class="ac-codigo"><div class="ac-codigo-encab"><span>Python</span><em>Paso 1. Clasificar por etapa</em></div><pre><code>import pandas as pd

c = pd.read_csv("cartera_cierre.csv")

c["etapa"] = 1
c.loc[c["dias_mora"] &gt;= 30, "etapa"] = 2
c.loc[c["dias_mora"] &gt;= 90, "etapa"] = 3

print(c["etapa"].value_counts().sort_index())</code></pre></div>
      <p>Es el mismo patrón del Módulo 0: se pone 1 en todas las filas y luego se sobrescriben las que cumplen cada condición. El orden importa, porque una operación con 120 días cumple las dos y debe quedar en etapa 3.</p>
      <div class="ac-codigo"><div class="ac-codigo-encab"><span>Python</span><em>Paso 2. Aplicar la fórmula</em></div><pre><code># El horizonte cambia con la etapa: doce meses en la 1, toda la vida en 2 y 3
c["pd_aplicable"] = c["pd_12m"].where(c["etapa"] == 1, c["pd_lifetime"])

c["ead"] = c["saldo"] + c["linea_no_usada"] * c["factor_conversion"]
c["perdida_esperada"] = c["pd_aplicable"] * c["lgd"] * c["ead"]

print(f"Provisión recalculada: {c['perdida_esperada'].sum():,.2f}")</code></pre></div>
      <p>where es un si condicional aplicado a toda la columna: deja la PD a doce meses cuando la etapa es 1 y la de toda la vida en el resto. La exposición suma el saldo más la parte del cupo no usado que se espera consumir.</p>

diferencia = c["perdida_esperada"].sum() - SALDO_MAYOR
print(f"Diferencia contra el mayor: {diferencia:,.2f}")

if abs(diferencia) &gt; 0.01:
    print("Requerir la composición del ajuste de la administración")</code></pre></div>
      <p>El guion bajo dentro del número es solo un separador visual para leerlo mejor; Python lo ignora. Una diferencia sin explicación es un hallazgo aunque el monto sea inmaterial: indica que el control de conciliación no está operando.</p>

      <h3>Dos pérdidas distintas y dos respuestas distintas</h3>
    </div>
    <div class="ac-cedula-cuerpo">
      <p>La pérdida de una cartera no es un número: es una distribución. La pérdida esperada es su valor medio. La pérdida inesperada es lo que puede ocurrir por sobre ese promedio en un escenario desfavorable.</p>

      <table class="ac-tabla"><thead><tr><th>Concepto</th><th>Qué representa</th><th>Cómo se cubre</th><th>Dónde aparece</th></tr></thead><tbody><tr><td>Pérdida esperada</td><td>Valor medio de la distribución</td><td>Provisión</td><td>Resultado y balance</td></tr><tr><td>Pérdida inesperada</td><td>Desviación adversa sobre la media</td><td>Capital</td><td>Patrimonio y requerimientos</td></tr></tbody></table>
      <div class="ac-nota"><strong>Por qué importa la distinción</strong>Provisionar la pérdida inesperada o pretender cubrir la esperada con capital son errores conceptuales con efecto contable. La primera es un gasto del ejercicio; la segunda es una exigencia patrimonial.</div>

    </div>
    <div class="ac-cedula-cuerpo">
      <p>Para construir la distribución de pérdidas se modelan dos componentes por separado: con qué frecuencia ocurren los incumplimientos y de qué magnitud es la pérdida cuando ocurren.</p>
      <blockquote class="ac-cita">Se van ajustando cuáles son las mejores distribuciones en términos de frecuencia y severidad, y ahí uno compara el valor en riesgo y define cuál es la que mejor se ajusta en base a múltiples indicadores.<cite>Clase 8, aprox. 02:36:37</cite></blockquote>
      <p>El valor en riesgo es el percentil de esa distribución para un nivel de confianza dado. Decir que el valor en riesgo al 99 % es un monto determinado significa que, bajo los supuestos del modelo, se espera superar esa pérdida en uno de cada cien períodos.</p>

  <section class="ac-cedula" data-cedula="H-3">
    <div class="ac-cedula-encab">
      <span class="ref">H-3</span>
      <h3>Stress test: qué es y qué no es</h3>
    </div>
    <div class="ac-cedula-cuerpo">
      <p>Una prueba de tensión proyecta el comportamiento de la cartera bajo condiciones adversas definidas. No es una predicción: es una medición de sensibilidad ante un escenario que se supone posible.</p>
      <blockquote class="ac-cita">El concepto de stress test de riesgo de crédito busca pronosticar escenarios futuros, obviamente escenarios de estrés, condiciones adversas.<cite>Clase 8, aprox. 02:47:21</cite></blockquote>
      <ol><li>Definir el escenario adverso y sus variables macroeconómicas.</li><li>Traducir esas variables a efectos sobre los parámetros de riesgo.</li><li>Recalcular la pérdida esperada y la inesperada bajo el escenario.</li><li>Evaluar el efecto sobre resultados, provisiones y suficiencia de capital.</li><li>Documentar las acciones de mitigación disponibles.</li></ol>
      <div class="ac-riesgo"><strong>Qué sale mal</strong>El escenario adverso es más benigno que la peor situación efectivamente observada en la historia de la institución. Una prueba de tensión que no tensiona no informa nada, y consume recursos que aparentan cumplimiento.</div>
      <div class="ac-nota"><strong>Procedimiento</strong>Contrastar los supuestos del escenario adverso contra los valores efectivamente observados en las últimas crisis relevantes. Si el escenario adverso es menos severo que lo ya ocurrido, corresponde observación.</div>
    </div>
    <div class="ac-cedula-pie">
      <button class="ac-btn ac-btn-secundario" data-marcar="H-3">Marcar cédula revisada</button>
      <span class="ac-marca-aud" data-marca-de="H-3"></span>
    </div>
  </section>

  <section class="ac-cedula" data-cedula="H-4">
    <div class="ac-cedula-encab">
      <span class="ref">H-4</span>
      <h3>Castigo, recupero y presupuesto de riesgo</h3>
    </div>
    <div class="ac-cedula-cuerpo">
      <p>Cuando una operación se considera irrecuperable se castiga: sale del activo contra la provisión constituida. La gestión posterior puede recuperar parte de ese monto, y ese recupero se reconoce cuando ocurre.</p>
      <blockquote class="ac-cita">El presupuesto es el gasto en riesgo más el castigo neto de recupero.<cite>Clase 8, aprox. 03:09:13</cite></blockquote>
      <p>El momento del castigo es una decisión con efecto sobre la cifra. Adelantarlo reduce la cartera bruta y consume provisión; postergarlo mantiene en el activo operaciones sin capacidad de recuperación.</p>
      <div class="ac-riesgo"><strong>Qué sale mal</strong>La política de castigo no está formalizada o admite excepciones sin aprobación documentada. El castigo pasa a ser una herramienta de administración de indicadores en lugar del reconocimiento de un hecho económico.</div>
      <div class="ac-nota"><strong>Procedimiento</strong>Obtener la política de castigo, verificar su aplicación sobre una muestra y revisar las excepciones del período con su aprobación. Contrastar la antigüedad de la mora al momento del castigo contra el criterio declarado.</div>
    </div>

  <section class="ac-cedula" data-cedula="H-5">
    <div class="ac-cedula-encab">
      <span class="ref">H-5</span>
      <h3>El memorando de validación independiente</h3>
    </div>
    <div class="ac-cedula-cuerpo">
      <p>El cierre del programa es el documento que consolida el trabajo: qué se revisó, con qué alcance, qué se encontró y qué efecto tiene sobre la cifra. Es el entregable que da valor al resto de los papeles de trabajo.</p>
      <table class="ac-tabla"><thead><tr><th>Sección</th><th>Contenido</th><th>Módulo que la alimenta</th></tr></thead><tbody><tr><td>Alcance y limitaciones</td><td>Qué se revisó y qué no, y por qué</td><td>I y III</td></tr><tr><td>Datos y variables</td><td>Calidad, fuga de información, binning</td><td>II</td></tr><tr><td>Segmentación</td><td>Criterio, estabilidad, efecto en parámetros</td><td>IV</td></tr><tr><td>Desempeño</td><td>Discriminación y calibración</td><td>V</td></tr><tr><td>Estabilidad</td><td>PSI, fuera de tiempo, monitoreo</td><td>VI</td></tr><tr><td>Provisión</td><td>Recálculo y conciliación</td><td>VII</td></tr><tr><td>Capital y tensión</td><td>Supuestos y severidad de escenarios</td><td>VIII</td></tr><tr><td>Hallazgos y efecto</td><td>Clasificados por severidad y efecto en la cifra</td><td>Todos</td></tr></tbody></table>
      <div class="ac-umbral"><strong>Regla de redacción de hallazgos</strong>Cada hallazgo declara la condición observada, el criterio contra el que se compara, la causa, el efecto cuantificado cuando es posible y la recomendación. Un hallazgo sin criterio explícito es una opinión.</div>
      <div class="ac-nota"><strong>Independencia</strong>La validación debe ser realizada por alguien distinto de quien construyó el modelo, con acceso a los datos y a la documentación, y con capacidad de reportar a un nivel distinto del área de riesgo. Sin las tres condiciones, la revisión puede ser técnicamente correcta y no constituir validación independiente.</div>
    </div>

  <section class="ac-cedula" data-cedula="H-6">
    <div class="ac-cedula-encab">
      <span class="ref">H-6</span>
      <h3>Laboratorio: distribución de pérdidas y capital</h3>
    </div>
    <div class="ac-cedula-cuerpo">
      <p>El simulador mostró cómo la correlación engorda la cola. Acá se construye la distribución completa y se separan los dos números: el que se provisiona y el que se cubre con capital.</p>
      <div class="ac-codigo"><div class="ac-codigo-encab"><span>Python</span><em>Paso 1. Un solo escenario</em></div><pre><code>import numpy as np

rng = np.random.default_rng(20260722)

pd_ = c["pd_aplicable"].to_numpy()
lgd = c["lgd"].to_numpy()
ead = c["ead"].to_numpy()

incumple = rng.random(len(pd_)) &lt; pd_
print(f"Pérdida del escenario: {(ead[incumple] * lgd[incumple]).sum():,.0f}")</code></pre></div>
      <p>rng.random sortea un número entre 0 y 1 por cada operación. Si sale menor que su probabilidad de incumplir, esa operación incumple en este escenario. Ejecuta la celda varias veces: el resultado cambia. Ese es justamente el punto.</p>
      <div class="ac-codigo"><div class="ac-codigo-encab"><span>Python</span><em>Paso 2. Repetirlo muchas veces</em></div><pre><code>SIMULACIONES = 20_000
perdidas = np.empty(SIMULACIONES)

for i in range(SIMULACIONES):
    incumple = rng.random(len(pd_)) &lt; pd_
    perdidas[i] = (ead[incumple] * lgd[incumple]).sum()

print(f"Pérdida esperada   {perdidas.mean():&gt;14,.0f}   -&gt; provisión")
print(f"VaR al 99 %        {np.percentile(perdidas, 99):&gt;14,.0f}")</code></pre></div>
      <p>El bucle repite el escenario veinte mil veces y guarda cada resultado. El promedio de todos es la pérdida esperada. El percentil 99 deja fuera solo el 1 % peor: ese es el valor en riesgo. La diferencia entre ambos es lo que se cubre con capital.</p>
      <div class="ac-riesgo"><strong>El supuesto que hay que cuestionar</strong>El código sortea cada operación por separado, como si los incumplimientos fueran independientes. En una crisis ocurren juntos. Esa correlación es lo que engorda la cola, y un modelo que la ignora subestima el capital sin que ningún dato observado lo delate.</div>
      <div class="ac-codigo"><div class="ac-codigo-encab"><span>Python</span><em>Paso 3. El escenario de tensión</em></div><pre><code>pd_estres = np.clip(pd_ * 2.4, 0, 1)
print(f"Pérdida esperada bajo tensión: {(pd_estres * lgd * ead).sum():,.0f}")</code></pre></div>
      <div class="ac-nota"><strong>Cierre del programa</strong>El factor de 2,4 no es un número universal: sale de comparar la tasa de incumplimiento de la peor crisis observada contra la del período normal. Ese cálculo, hecho con los datos de la entidad, es el que sostiene si la prueba de tensión tensiona de verdad.</div>
    </div>

  // Las rutas pasan a ser de hash: no hay archivos separados.
  AC.Rutas.cert = id => "#/cert/" + id;
  AC.Rutas.diploma = () => "#/diploma";
  AC.Rutas.indice = () => "#/";
  AC.Rutas.equipo = () => "#/equipo";
  AC.programa.modulos.forEach(m => { m.url = "#/m/" + m.id; });

  if (getComputedStyle(document.documentElement).getPropertyValue("--ac-logo").trim() !== "none") {
    $("#logo").classList.add("tiene-imagen");
  }

  function encabezado(titulo, sub) {
    $("#cab-titulo").textContent = titulo;
    $("#cab-ref").textContent = sub;
  }

  function montarPortal() {
    app.className = "";
    app.innerHTML = PORTAL_HTML;
    encabezado("AuditCaat's Data Assurance", "Programa de formación interna");
    portalJS();
  }

  function portalJS() {

  const $ = AC.util.$;

  // El logo se pinta como fondo CSS; si no se cargó el base64, queda el monograma.
  if (getComputedStyle(document.documentElement).getPropertyValue("--ac-logo").trim() !== "none") {
    $("#logo").classList.add("tiene-imagen");
  }

  function pintar() {
    const p = AC.Participante.obtener();
    $("#bloque-registro").hidden = !!p;
    $("#bloque-ruta").hidden = !p;
    if (!p) return;

    $("#cab-participante").innerHTML =
      AC.util.esc(p.nombre) + "<br>" + AC.util.esc(p.organizacion);

    AC.Portal.render("#ruta");
    $("#bloque-diploma").hidden = !AC.Progreso.programaCompleto();

    $("#enlace-equipo").href = AC.Rutas.equipo();

    if (!AC.Store.persistente()) {
      $("#cab-participante").innerHTML +=
        '<br><span style="color:#F0C24B">Sin guardado permanente en este navegador</span>';
    }
  }

  // ---- Inscripción ----
  function validar(id, prueba) {
    const campo = $("#" + id).closest(".ac-campo");
    const ok = prueba($("#" + id).value.trim());
    campo.classList.toggle("invalido", !ok);
    return ok;
  }

  $("#btn-inscribir").addEventListener("click", function () {
    const ok = [
      validar("f-nombre", v => v.split(/\s+/).length >= 2),
      validar("f-doc",    v => v.length >= 5),
      validar("f-mail",   v => /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v)),
      validar("f-cargo",  v => v !== ""),
      validar("f-org",    v => v.length >= 2)
    ].every(Boolean);
    if (!ok) return;

    AC.Participante.registrar({
      nombre: $("#f-nombre").value,
      documento: $("#f-doc").value,
      email: $("#f-mail").value,
      cargo: $("#f-cargo").value,
      organizacion: $("#f-org").value
    });
    pintar();
    const ruta = $("#bloque-ruta");
    if (ruta.scrollIntoView) ruta.scrollIntoView({ behavior: "smooth", block: "start" });
  });

  // ---- Convalidación ----
  $("#f-conv-mod").innerHTML = AC.programa.modulos
    .map(m => '<option value="' + m.id + '">' + m.ref + " · " + AC.util.esc(m.titulo) + "</option>").join("");

  $("#btn-convalidar").addEventListener("click", function () {
    const cod = $("#f-conv-cod").value.trim().toUpperCase();
    const mod = $("#f-conv-mod").value;
    const ok = AC.Progreso.convalidar(mod, cod);
    $("#f-conv-cod").closest(".ac-campo").classList.toggle("invalido", !ok);
    $("#conv-msg").textContent = ok ? "Módulo convalidado." : "";
    $("#conv-msg").style.color = "var(--ac-ok)";
    if (ok) { $("#f-conv-cod").value = ""; pintar(); }
  });

  // ---- Respaldo ----
  const msg = (texto, color) => {
    const n = $("#resp-msg");
    n.textContent = texto;
    n.style.color = color || "var(--ac-tinta-2)";
  };

  $("#btn-exportar").addEventListener("click", function () {
    const nombre = AC.Respaldo.descargar();
    msg(nombre ? "Descargado " + nombre : "No hay avance que respaldar.", "var(--ac-ok)");
  });

  $("#f-importar").addEventListener("change", function (ev) {
    const archivo = ev.target.files[0];
    if (!archivo) return;
    const lector = new FileReader();
    lector.onload = function () {
      let r = AC.Respaldo.restaurar(lector.result, false);

      if (!r.ok && r.distinto) {
        const seguir = confirm(
          "El respaldo pertenece a " + r.entrante.nombre + " y en este navegador " +
          "está registrado " + r.actual.nombre + ".\n\n" +
          "Si continúas, se reemplazará al participante actual. ¿Continuar?");
        if (!seguir) { msg("Restauración cancelada."); ev.target.value = ""; return; }
        r = AC.Respaldo.restaurar(lector.result, true);
      }

      if (!r.ok) { msg(r.motivo, "var(--ac-tick)"); ev.target.value = ""; return; }

      pintar();
      let t = "Avance restaurado: " + r.aprobados + " de " +
              AC.programa.modulos.length + " módulos aprobados.";
      if (r.alterado) t += " El archivo fue modificado después de generarse; " +
                           "revisa el avance antes de darlo por válido.";
      msg(t, r.alterado ? "var(--ac-alerta)" : "var(--ac-ok)");
      ev.target.value = "";
    };
    lector.readAsText(archivo);
  });

  // ---- Diploma ----
  $("#btn-diploma").addEventListener("click", function () {
    const d = AC.Certificado.emitirDiploma();
    if (d) location.href = AC.Rutas.diploma();
  });

  // ---- Salir ----
  $("#btn-salir").addEventListener("click", function (e) {
    e.preventDefault();
    if (confirm("Se borrarán tu inscripción y tu avance en este navegador. Los certificados ya emitidos siguen siendo válidos. ¿Continuar?")) {
      AC.Participante.salir();
      location.reload();
    }
  });

  pintar();

  }

  function montarModulo(id) {
    if (!MODULOS_HTML[id]) return montarPortal();
    if (!AC.Participante.obtener()) { location.hash = "#/"; return; }
    const mod = AC.moduloPorId(id);
    app.className = "ac-angosto";
    app.style.paddingTop = "var(--e-7)";
    app.style.paddingBottom = "var(--e-8)";
    app.innerHTML = '<p class="ac-no-imprimir" style="margin-bottom:var(--e-5)">' +
                    '<a href="#/">Volver al índice</a></p>' + MODULOS_HTML[id];
    encabezado(mod.titulo, "Referencia " + mod.ref);
    ACModulo.iniciar(id, BANCOS[id]);
  }

  function montarCertificado(id) {
    if (!AC.Participante.obtener()) { location.hash = "#/"; return; }
    app.className = "";
    app.style.padding = "0";
    app.innerHTML =
      '<div class="ac-envoltura ac-no-imprimir" style="padding-top:var(--e-5);' +
      'display:flex;gap:var(--e-3);flex-wrap:wrap">' +
      '<button class="ac-btn ac-btn-primario" id="btn-imprimir">Imprimir o guardar en PDF</button>' +
      '<a class="ac-btn ac-btn-secundario" id="btn-li" target="_blank" rel="noopener">Agregar a LinkedIn</a>' +
      '<button class="ac-btn ac-btn-secundario" id="btn-json">Descargar constancia</button>' +
      '<a class="ac-btn ac-btn-secundario" href="#/">Volver al índice</a></div><div id="hoja"></div>';
    const r = ACCert.render("#hoja", id === "__programa__"
      ? { tipo: "programa" } : { tipo: "modulo", moduloId: id });
    if (r) ACCert.enlazarAcciones(r.certificado, r.titulo);
    encabezado("Certificado", "AuditCaat's Data Assurance");
  }

  function montarEquipo() {
    app.className = "ac-envoltura";
    app.style.paddingTop = "var(--e-7)";
    app.style.paddingBottom = "var(--e-8)";
    app.innerHTML = '<p class="ac-no-imprimir" style="margin-bottom:var(--e-5)">' +
                    '<a href="#/">Volver al índice</a></p><div id="equipo"></div>';
    ACEquipo.montar("#equipo");
    encabezado("Seguimiento del equipo", "Programa MRC-2026");
  }

  function enrutar() {
    const h = location.hash || "#/";
    if (h === "#/equipo") montarEquipo();
    else if (h.indexOf("#/m/") === 0) montarModulo(h.slice(4));
    else if (h === "#/diploma") montarCertificado("__programa__");
    else if (h.indexOf("#/cert/") === 0) montarCertificado(h.slice(7));
    else montarPortal();
    if (window.scrollTo) window.scrollTo(0, 0);
  }

  window.addEventListener("hashchange", enrutar);
  enrutar();
})();
</script>
