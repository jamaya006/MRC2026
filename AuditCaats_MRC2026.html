/* ===================================================================
   AuditCaat's — Seguimiento del equipo  (ac_equipo.js)

   Consolida los archivos de avance que envian los participantes y
   produce la tabla de control del programa. Todo ocurre en el
   navegador del coordinador: los archivos no se suben a ningun lado.
   =================================================================== */

(function (global) {
  "use strict";

  const ACEquipo = {
    registros: [],

    montar(destino) {
      const nodo = typeof destino === "string" ? document.querySelector(destino) : destino;
      if (!nodo) return;
      this.registros = [];

      nodo.innerHTML = `
        <div class="ac-cedula">
          <div class="ac-cedula-encab">
            <span class="ref">EQ</span>
            <h3>Seguimiento del equipo</h3>
          </div>
          <div class="ac-cedula-cuerpo">
            <p>Carga los archivos de avance que envían los participantes. Puedes
            seleccionar varios a la vez. Los archivos se procesan en este navegador
            y no se envían a ningún servidor.</p>
            <div style="display:flex;gap:var(--e-3);flex-wrap:wrap;align-items:center">
              <label class="ac-btn ac-btn-primario" for="eq-archivos" style="margin:0">
                Cargar archivos de avance</label>
              <input type="file" id="eq-archivos" accept=".json,application/json" multiple hidden>
              <button class="ac-btn ac-btn-secundario" id="eq-csv" disabled>Exportar a CSV</button>
              <button class="ac-btn ac-btn-secundario" id="eq-limpiar" disabled>Limpiar</button>
            </div>
            <p id="eq-msg" style="margin:var(--e-4) 0 0;font-size:var(--t-sm);color:var(--ac-tinta-2)"></p>
          </div>
        </div>
        <div id="eq-tabla"></div>`;

      const $ = s => nodo.querySelector(s);

      $("#eq-archivos").addEventListener("change", ev => {
        const archivos = Array.from(ev.target.files);
        let leidos = 0, errores = [];

        archivos.forEach(f => {
          const lector = new FileReader();
          lector.onload = () => {
            const r = AC.Respaldo.revisar(lector.result);
            if (!r.ok) errores.push(f.name + ": " + r.motivo);
            else this.agregar(AC.Respaldo.resumir(r.datos));
            if (++leidos === archivos.length) this.pintar(nodo, errores);
          };
          lector.readAsText(f);
        });
        ev.target.value = "";
      });

      $("#eq-csv").addEventListener("click", () => this.csv());
      $("#eq-limpiar").addEventListener("click", () => {
        this.registros = [];
        this.pintar(nodo, []);
      });
    },

    /** Un participante por documento: si llega un archivo mas nuevo, reemplaza. */
    agregar(r) {
      const i = this.registros.findIndex(x => x.documento === r.documento);
      if (i < 0) this.registros.push(r);
      else if (r.aprobados >= this.registros[i].aprobados) this.registros[i] = r;
    },

    pintar(nodo, errores) {
      const $ = s => nodo.querySelector(s);
      const esc = AC.util.esc;
      const hay = this.registros.length > 0;

      $("#eq-csv").disabled = !hay;
      $("#eq-limpiar").disabled = !hay;

      const partes = [];
      if (errores.length) partes.push("No se pudieron leer " + errores.length + " archivo(s).");
      if (hay) partes.push(this.registros.length + " participante(s) cargado(s).");
      $("#eq-msg").textContent = partes.join(" ");
      $("#eq-msg").title = errores.join("\n");

      if (!hay) { $("#eq-tabla").innerHTML = ""; return; }

      const mods = AC.programa.modulos;
      const orden = this.registros.slice().sort((a, b) => b.aprobados - a.aprobados);

      const filas = orden.map(r => {
        const celdas = r.detalle.map(d =>
          '<td class="num" title="' + (d.codigo ? esc(d.codigo) : "sin certificado") + '">' +
          (d.aprobado ? '<span style="color:var(--ac-ok);font-weight:700">' +
                        esc(mods.find(m => m.id === d.id).marca) + "</span>" : "·") +
          "</td>").join("");
        const alerta = r.firmaValida ? "" :
          ' <span style="color:var(--ac-alerta)" title="El archivo fue modificado después de generarse">△</span>';
        return "<tr><td>" + esc(r.nombre) + alerta +
               '<br><span style="color:var(--ac-tinta-3);font-size:var(--t-xs)">' +
               esc(r.documento) + " · " + esc(r.organizacion) + "</span></td>" +
               celdas +
               '<td class="num">' + r.aprobados + "/" + r.total + "</td>" +
               '<td class="num">' + r.horas.toFixed(1).replace(".", ",") + "</td>" +
               '<td class="num">' + (r.maximo ? Math.round(r.puntaje / r.maximo * 100) + " %" : "—") + "</td>" +
               '<td class="num">' + esc(r.generado) + "</td></tr>";
      }).join("");

      const totalMods = mods.map(m =>
        '<td class="num">' + this.registros.filter(r =>
          r.detalle.find(d => d.id === m.id && d.aprobado)).length + "</td>").join("");

      $("#eq-tabla").innerHTML =
        '<div class="ac-cedula"><div class="ac-cedula-cuerpo" style="overflow-x:auto">' +
        '<table class="ac-tabla"><thead><tr><th>Participante</th>' +
        mods.map(m => '<th class="num" title="' + esc(m.titulo) + '">' + esc(m.ref) + "</th>").join("") +
        '<th class="num">Avance</th><th class="num">Horas</th>' +
        '<th class="num">Logro</th><th class="num">Corte</th></tr></thead>' +
        "<tbody>" + filas + "</tbody>" +
        '<tfoot><tr><th>Aprobaciones por módulo</th>' + totalMods +
        '<th colspan="4"></th></tr></tfoot></table>' +
        '<p style="font-size:var(--t-xs);color:var(--ac-tinta-3);margin:var(--e-3) 0 0">' +
        "Pasa el cursor sobre una marca para ver el código del certificado. " +
        "El triángulo junto a un nombre indica que el archivo fue modificado después " +
        "de generarse.</p></div></div>";
    },

    csv() {
      const mods = AC.programa.modulos;
      const cab = ["Nombre", "Documento", "Correo", "Organizacion"]
        .concat(mods.map(m => m.ref + " " + m.titulo))
        .concat(["Modulos aprobados", "Horas acreditadas", "Logro", "Fecha del respaldo", "Integridad"]);

      const filas = this.registros.map(r => {
        const cols = [r.nombre, r.documento, r.email, r.organizacion]
          .concat(r.detalle.map(d => d.aprobado ? (d.codigo || "aprobado") : ""))
          .concat([r.aprobados, r.horas.toFixed(1),
                   r.maximo ? Math.round(r.puntaje / r.maximo * 100) + "%" : "",
                   r.generado, r.firmaValida ? "OK" : "ARCHIVO MODIFICADO"]);
        return cols.map(c => '"' + String(c).replace(/"/g, '""') + '"').join(";");
      });

      // BOM para que Excel reconozca los acentos al abrir el archivo
      const blob = new Blob(["\ufeff" + [cab.map(c => '"' + c + '"').join(";")]
        .concat(filas).join("\r\n")], { type: "text/csv;charset=utf-8" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "seguimiento_" + AC.programa.codigo + "_" +
                   new Date().toISOString().slice(0, 10) + ".csv";
      a.click();
      URL.revokeObjectURL(a.href);
    }
  };

  global.ACEquipo = ACEquipo;
})(window);

/* ===================================================================
   AuditCaat's — Simuladores del programa  (ac_widgets.js)

   Cada simulador se declara en el contenido como ("widget", "id") y
   se monta sobre <div data-widget="id">. Todo se calcula en el
   navegador con SVG: sin librerias, sin red, sin imagenes.

   Los datos son sinteticos y deterministas: todos los participantes
   ven exactamente los mismos numeros.
   =================================================================== */

(function (global) {
  "use strict";

  /* ---------- Utilidades ------------------------------------------ */

  // Generador con semilla: misma semilla, misma serie, en todo navegador.
  function azar(semilla) {
    let a = semilla >>> 0;
    return function () {
      a = (a + 0x6D2B79F5) >>> 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function normal(r) {                       // Box-Muller
    return Math.sqrt(-2 * Math.log(1 - r())) * Math.cos(2 * Math.PI * r());
  }
  const fmt = (n, d) => n.toLocaleString("es-CL", {
    minimumFractionDigits: d === undefined ? 0 : d,
    maximumFractionDigits: d === undefined ? 0 : d });
  const pct = (n, d) => fmt(n * 100, d === undefined ? 1 : d) + " %";
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  /* ---------- Andamiaje de la interfaz ----------------------------- */

  function control(cfg) {
    const id = "w" + Math.random().toString(36).slice(2, 8);
    return `<div class="ac-w-ctrl">
      <label for="${id}">${cfg.etiqueta}<b data-valor></b></label>
      <input type="range" id="${id}" min="${cfg.min}" max="${cfg.max}"
             step="${cfg.paso || 1}" value="${cfg.valor}" data-slider="${cfg.nombre}">
    </div>`;
  }

  function interruptor(cfg) {
    return `<label class="ac-w-check">
      <input type="checkbox" data-check="${cfg.nombre}" ${cfg.valor ? "checked" : ""}>
      <span>${cfg.etiqueta}</span></label>`;
  }

  function armar(nodo, cfg) {
    nodo.innerHTML = `
      <div class="ac-widget">
        <div class="ac-w-encab">
          <span>Simulador</span><em>${cfg.titulo}</em>
        </div>
        <div class="ac-w-cuerpo">
          <div class="ac-w-controles">${cfg.controles}</div>
          <div class="ac-w-lienzo" data-lienzo></div>
          <div class="ac-w-lectura" data-lectura></div>
        </div>
        <div class="ac-w-pie">${cfg.pie}</div>
      </div>`;

    const estado = {};
    const sliders = nodo.querySelectorAll("[data-slider]");
    const checks = nodo.querySelectorAll("[data-check]");

    function leer() {
      sliders.forEach(s => { estado[s.dataset.slider] = parseFloat(s.value); });
      checks.forEach(c => { estado[c.dataset.check] = c.checked; });
      return estado;
    }
    function refrescar() {
      leer();
      sliders.forEach(s => {
        const b = s.closest(".ac-w-ctrl").querySelector("[data-valor]");
        if (b) b.textContent = cfg.etiquetaValor(s.dataset.slider, parseFloat(s.value));
      });
      cfg.dibujar(estado,
        nodo.querySelector("[data-lienzo]"),
        nodo.querySelector("[data-lectura]"));
    }
    sliders.forEach(s => s.addEventListener("input", refrescar));
    checks.forEach(c => c.addEventListener("change", refrescar));
    refrescar();
  }

  // Marco SVG con ejes
  function svg(ancho, alto, contenido) {
    return `<svg viewBox="0 0 ${ancho} ${alto}" preserveAspectRatio="xMidYMid meet"
                 role="img" aria-hidden="true">${contenido}</svg>`;
  }
  const eje = (x1, y1, x2, y2) =>
    `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" class="w-eje"/>`;
  const texto = (x, y, t, clase) =>
    `<text x="${x}" y="${y}" class="w-txt ${clase || ""}">${t}</text>`;

  function lectura(items) {
    return items.map(i =>
      `<div class="${i.alerta ? "alerta" : ""}"><dt>${i.k}</dt><dd>${i.v}</dd></div>`).join("");
  }

  /* =================================================================
     M01 — El horizonte cambia la tasa de incumplimiento
     ================================================================= */
  const wVentana = {
    titulo: "Ventana de desempeño",
    montar(nodo) {
      const r = azar(20260722);
      // Momento del incumplimiento de cada operación, en meses
      const meses = Array.from({ length: 4000 }, () => {
        const u = r();
        return u < 0.14 ? 1 + Math.floor(Math.abs(normal(r)) * 14) : 999;
      });
      armar(nodo, {
        titulo: this.titulo,
        controles: control({ nombre: "h", etiqueta: "Horizonte observado", min: 3, max: 36, valor: 12 }),
        etiquetaValor: (n, v) => v + " meses",
        dibujar(e, lienzo, lect) {
          const h = e.h;
          const tasa = meses.filter(m => m <= h).length / meses.length;
          const A = 620, B = 190;
          let barras = "";
          for (let m = 1; m <= 36; m++) {
            const n = meses.filter(x => x === m).length;
            const alto = (n / 90) * 130;
            barras += `<rect x="${20 + (m - 1) * 16.4}" y="${160 - alto}" width="13"
              height="${Math.max(alto, 0.5)}" class="${m <= h ? "w-barra-on" : "w-barra-off"}"/>`;
          }
          const xc = 20 + h * 16.4 - 1.5;
          lienzo.innerHTML = svg(A, B,
            barras +
            `<line x1="${xc}" y1="14" x2="${xc}" y2="162" class="w-corte"/>` +
            texto(xc + 5, 24, "corte", "w-corte-t") +
            eje(18, 162, 606, 162) +
            texto(20, 182, "mes 1") + texto(546, 182, "mes 36"));
          lect.innerHTML = lectura([
            { k: "Tasa de incumplimiento", v: pct(tasa, 2) },
            { k: "Operaciones malas", v: fmt(meses.filter(m => m <= h).length) },
            { k: "Aún sin madurar", v: fmt(meses.filter(m => m > h && m < 999).length),
              alerta: h < 12 }
          ]);
        },
        pie: "La misma cartera tiene tasas distintas según el horizonte. Un modelo a doce " +
             "meses y otro a veinticuatro no son comparables aunque midan lo mismo. Si la " +
             "ventana es corta, parte de los incumplimientos todavía no ocurrió."
      });
    }
  };

  /* =================================================================
     M02 — Cuántos tramos: el IV sube y los tramos se vacían
     ================================================================= */
  const wBinning = {
    titulo: "Tramos, WOE e information value",
    montar(nodo) {
      const r = azar(880123);
      const datos = Array.from({ length: 6000 }, () => {
        const x = clamp(30 + normal(r) * 18, 0, 96);          // antigüedad en meses
        const p = 1 / (1 + Math.exp((x - 26) / 9));           // más antiguo, mejor
        return { x: x, malo: r() < p * 0.30 ? 1 : 0 };
      }).sort((a, b) => a.x - b.x);

      armar(nodo, {
        titulo: this.titulo,
        controles: control({ nombre: "k", etiqueta: "Número de tramos", min: 2, max: 20, valor: 5 }) +
                   interruptor({ nombre: "opt", etiqueta: "Cortes automáticos por information value", valor: false }),
        etiquetaValor: (n, v) => v + " tramos",
        dibujar(e, lienzo, lect) {
          const k = e.k, n = datos.length, porTramo = Math.floor(n / k);
          // Dos formas de cortar: por cuantiles deja tramos parejos; el corte
          // automatico busca maximizar el IV y produce tramos muy desiguales.
          const min = datos[0].x, max = datos[n - 1].x;
          const grupo = i => {
            if (!e.opt) return datos.slice(i * porTramo, i === k - 1 ? n : (i + 1) * porTramo);
            const a = min + (max - min) * (i / k), b = min + (max - min) * ((i + 1) / k);
            return datos.filter(d => d.x >= a && (i === k - 1 ? d.x <= b : d.x < b));
          };
          const B = Math.max(1, datos.filter(d => !d.malo).length);
          const M = Math.max(1, datos.filter(d => d.malo).length);
          let iv = 0, chicos = 0, woes = [];
          for (let i = 0; i < k; i++) {
            const g = grupo(i);
            if (!g.length) { woes.push({ w: 0, part: 0 }); chicos++; continue; }
            const mal = g.filter(d => d.malo).length, bue = g.length - mal;
            const pb = (bue + 0.5) / (B + 0.5 * k), pm = (mal + 0.5) / (M + 0.5 * k);
            const w = Math.log(pb / pm);
            iv += (pb - pm) * w;
            woes.push({ w: w, part: g.length / n });
            if (g.length / n < 0.05) chicos++;
          }
          const A = 620, H = 190, cero = 100, ancho = 580 / k;
          let barras = woes.map((o, i) => {
            const alto = clamp(o.w * 42, -84, 84);
            return `<rect x="${22 + i * ancho + 2}" y="${alto > 0 ? cero - alto : cero}"
              width="${Math.max(ancho - 4, 2)}" height="${Math.abs(alto) || 1}"
              class="${o.part < 0.05 ? "w-barra-mal" : (o.w >= 0 ? "w-barra-on" : "w-barra-neg")}"/>`;
          }).join("");
          lienzo.innerHTML = svg(A, H,
            barras + eje(20, cero, 606, cero) +
            texto(22, 22, "WOE positivo: concentra buenos") +
            texto(22, 182, "WOE negativo: concentra malos"));
          lect.innerHTML = lectura([
            { k: "Information value", v: fmt(iv, 4), alerta: iv > 0.5 },
            { k: "Tramos bajo el 5 %", v: chicos, alerta: chicos > 0 },
            { k: "Lectura", v: iv < 0.02 ? "no aporta" : iv < 0.1 ? "débil"
                 : iv < 0.3 ? "aceptable" : iv < 0.5 ? "fuerte" : "sospechoso" }
          ]);
        },
        pie: "Con cortes por cuantiles los tramos quedan parejos. Activa los cortes " +
             "automáticos y sube el número de tramos: el information value mejora y al mismo " +
             "tiempo aparecen tramos en rojo, con menos del 5 % de la población. Ese es el " +
             "costo oculto del binning automático, y es lo que hay que pedir que justifiquen."
      });
    }
  };

  /* =================================================================
     M03 — Complejidad contra desempeño real
     ================================================================= */
  const wComplejidad = {
    titulo: "Complejidad del modelo y sobreajuste",
    montar(nodo) {
      armar(nodo, {
        titulo: this.titulo,
        controles: control({ nombre: "c", etiqueta: "Complejidad del modelo", min: 1, max: 20, valor: 4 }),
        etiquetaValor: (n, v) => "nivel " + v,
        dibujar(e, lienzo, lect) {
          const des = c => 0.70 + 0.29 * (1 - Math.exp(-c / 4.2));
          const val = c => 0.70 + 0.13 * (1 - Math.exp(-c / 3.0)) - 0.011 * Math.max(0, c - 6);
          const A = 620, H = 200, x = c => 30 + (c - 1) * 29, y = a => 178 - (a - 0.68) * 470;
          const linea = f => Array.from({ length: 20 }, (_, i) =>
            `${i ? "L" : "M"}${x(i + 1)},${y(f(i + 1))}`).join(" ");
          lienzo.innerHTML = svg(A, H,
            eje(28, 178, 606, 178) + eje(28, 12, 28, 178) +
            `<path d="${linea(des)}" class="w-linea-b"/>` +
            `<path d="${linea(val)}" class="w-linea-a"/>` +
            `<circle cx="${x(e.c)}" cy="${y(des(e.c))}" r="5" class="w-pto-b"/>` +
            `<circle cx="${x(e.c)}" cy="${y(val(e.c))}" r="5" class="w-pto-a"/>` +
            `<line x1="${x(e.c)}" y1="12" x2="${x(e.c)}" y2="178" class="w-corte"/>` +
            texto(36, 24, "desarrollo", "w-t-b") + texto(36, 40, "validación", "w-t-a") +
            texto(30, 194, "simple") + texto(556, 194, "complejo"));
          const brecha = des(e.c) - val(e.c);
          lect.innerHTML = lectura([
            { k: "AUC en desarrollo", v: fmt(des(e.c), 3) },
            { k: "AUC en validación", v: fmt(val(e.c), 3) },
            { k: "Brecha", v: fmt(brecha, 3), alerta: brecha > 0.05 }
          ]);
        },
        pie: "La curva de desarrollo nunca baja: por eso no sirve para decidir. La de " +
             "validación sube, se estanca y empieza a caer. Cuando la brecha pasa de cinco " +
             "puntos, el modelo está aprendiendo su propia muestra."
      });
    }
  };

  /* =================================================================
     M04 — Estandarizar o no estandarizar
     ================================================================= */
  const wSegmentos = {
    titulo: "Segmentación y escala de las variables",
    montar(nodo) {
      const r = azar(4477);
      // monto en millones, antigüedad en meses: escalas muy distintas
      const puntos = [];
      [[8, 12], [8, 46], [34, 14], [34, 48]].forEach(c => {
        for (let i = 0; i < 45; i++)
          puntos.push({ m: c[0] + normal(r) * 5, a: c[1] + normal(r) * 6 });
      });

      function kmedias(pts, k, estandarizar) {
        const em = estandarizar ? 1 / 13 : 1 / 13, ea = estandarizar ? 1 / 16 : 1 / 400;
        const cen = Array.from({ length: k }, (_, i) => ({
          m: pts[i * 37 % pts.length].m, a: pts[i * 53 % pts.length].a }));
        let asig = [];
        for (let it = 0; it < 25; it++) {
          asig = pts.map(p => {
            let mej = 0, d0 = Infinity;
            cen.forEach((c, j) => {
              const d = Math.pow((p.m - c.m) * em, 2) + Math.pow((p.a - c.a) * ea, 2);
              if (d < d0) { d0 = d; mej = j; }
            });
            return mej;
          });
          cen.forEach((c, j) => {
            const g = pts.filter((_, i) => asig[i] === j);
            if (g.length) {
              c.m = g.reduce((s, p) => s + p.m, 0) / g.length;
              c.a = g.reduce((s, p) => s + p.a, 0) / g.length;
            }
          });
        }
        return asig;
      }

      armar(nodo, {
        titulo: this.titulo,
        controles: control({ nombre: "k", etiqueta: "Número de grupos", min: 2, max: 6, valor: 4 }) +
                   interruptor({ nombre: "std", etiqueta: "Estandarizar las variables", valor: false }),
        etiquetaValor: (n, v) => "k = " + v,
        dibujar(e, lienzo, lect) {
          const asig = kmedias(puntos, e.k, e.std);
          const A = 620, H = 210;
          const px = p => 40 + (p.m / 46) * 550, py = p => 180 - (p.a / 62) * 160;
          const circulos = puntos.map((p, i) =>
            `<circle cx="${px(p).toFixed(1)}" cy="${py(p).toFixed(1)}" r="3.6"
              class="w-c${asig[i] % 6}"/>`).join("");
          lienzo.innerHTML = svg(A, H,
            circulos + eje(36, 182, 600, 182) + eje(36, 10, 36, 182) +
            texto(300, 202, "monto del crédito") +
            `<text x="14" y="100" class="w-txt" transform="rotate(-90 14 100)">antigüedad</text>`);
          // ¿los grupos se separan por monto o por antigüedad?
          const gs = Array.from({ length: e.k }, (_, j) => puntos.filter((_, i) => asig[i] === j));
          const varM = gs.map(g => g.length ? g.reduce((s, p) => s + p.m, 0) / g.length : 0);
          const varA = gs.map(g => g.length ? g.reduce((s, p) => s + p.a, 0) / g.length : 0);
          const disp = v => Math.max(...v) - Math.min(...v);
          const domina = disp(varM) / 46 > disp(varA) / 62 * 1.6;
          lect.innerHTML = lectura([
            { k: "Variables", v: e.std ? "estandarizadas" : "en su escala original" },
            { k: "Los grupos se separan por", v: domina ? "el monto, casi solo" : "ambas variables" },
            { k: "Diagnóstico", v: domina ? "la escala manda sobre el comportamiento" : "segmentación razonable",
              alerta: domina }
          ]);
        },
        pie: "Con las variables sin estandarizar, el monto absorbe toda la distancia y los " +
             "cortes salen verticales: la antigüedad deja de importar. Activa la casilla y " +
             "mira cómo se reordenan los grupos con exactamente los mismos datos."
      });
    }
  };

  /* =================================================================
     M05 — Punto de corte y costo de los dos errores
     ================================================================= */
  const wCorte = {
    titulo: "Punto de corte, matriz de confusión y costo",
    montar(nodo) {
      const r = azar(9091);
      const pob = Array.from({ length: 5000 }, () => {
        const malo = r() < 0.08;
        const s = clamp(malo ? 0.34 + normal(r) * 0.16 : 0.10 + normal(r) * 0.09, 0.001, 0.999);
        return { malo: malo, p: s };
      });

      armar(nodo, {
        titulo: this.titulo,
        controles:
          control({ nombre: "c", etiqueta: "Punto de corte", min: 1, max: 60, valor: 20 }) +
          control({ nombre: "rel", etiqueta: "Pérdida frente al margen", min: 2, max: 25, valor: 8 }),
        etiquetaValor: (n, v) => n === "c" ? v + " %" : v + " veces",
        dibujar(e, lienzo, lect) {
          const c = e.c / 100;
          const VP = pob.filter(o => o.malo && o.p >= c).length;
          const FN = pob.filter(o => o.malo && o.p < c).length;
          const FP = pob.filter(o => !o.malo && o.p >= c).length;
          const VN = pob.filter(o => !o.malo && o.p < c).length;
          const costo = k => pob.filter(o => o.malo && o.p < k).length * e.rel +
                             pob.filter(o => !o.malo && o.p >= k).length;
          let mejor = 0.01, cm = Infinity;
          for (let k = 0.01; k <= 0.60; k += 0.01) { const v = costo(k); if (v < cm) { cm = v; mejor = k; } }

          const A = 620, H = 200;
          const hist = (filtro, clase) => {
            let s = "";
            for (let i = 0; i < 60; i++) {
              const n = pob.filter(o => filtro(o) && o.p >= i / 100 && o.p < (i + 1) / 100).length;
              if (n) s += `<rect x="${24 + i * 9.6}" y="${170 - n / 2.2}" width="8.4"
                height="${n / 2.2}" class="${clase}"/>`;
            }
            return s;
          };
          const xc = 24 + e.c * 9.6, xo = 24 + mejor * 100 * 9.6;
          lienzo.innerHTML = svg(A, H,
            hist(o => !o.malo, "w-hist-b") + hist(o => o.malo, "w-hist-m") +
            eje(22, 172, 606, 172) +
            `<line x1="${xo}" y1="16" x2="${xo}" y2="172" class="w-optimo"/>` +
            `<line x1="${xc}" y1="10" x2="${xc}" y2="172" class="w-corte"/>` +
            texto(28, 24, "no incumplen", "w-t-b") + texto(28, 40, "incumplen", "w-t-a") +
            texto(xo - 18, 192, "óptimo", "w-optimo-t"));
          lect.innerHTML = lectura([
            { k: "Rechazados que habrían pagado", v: fmt(FP) },
            { k: "Aprobados que incumplieron", v: fmt(FN), alerta: FN > VP },
            { k: "Costo total del corte", v: fmt(costo(c)) },
            { k: "Corte de mínimo costo", v: pct(mejor, 0), alerta: Math.abs(mejor - c) > 0.03 }
          ]);
        },
        pie: "Mueve el corte y observa que el mínimo costo casi nunca está en 50 %. Sube la " +
             "razón entre pérdida y margen: cuanto más cuesta un crédito que no se paga, más " +
             "hacia la izquierda se va el corte óptimo."
      });
    }
  };

  /* =================================================================
     M06 — Cuánto desplazamiento hace falta para cruzar 0,25
     ================================================================= */
  const wPsi = {
    titulo: "Índice de estabilidad poblacional",
    montar(nodo) {
      const base = [0.06, 0.11, 0.17, 0.22, 0.19, 0.14, 0.08, 0.03];
      armar(nodo, {
        titulo: this.titulo,
        controles:
          control({ nombre: "d", etiqueta: "Desplazamiento de la población", min: -30, max: 30, valor: 0 }) +
          control({ nombre: "e", etiqueta: "Concentración", min: -20, max: 30, valor: 0 }),
        etiquetaValor: (n, v) => (v > 0 ? "+" : "") + v,
        dibujar(e, lienzo, lect) {
          const n = base.length, centro = (n - 1) / 2;
          let act = base.map((p, i) => {
            const mov = 1 + (e.d / 100) * (i - centro);
            const con = 1 + (e.e / 100) * (1 - Math.abs(i - centro) / centro);
            return Math.max(p * mov * con, 0.001);
          });
          const s = act.reduce((a, b) => a + b, 0);
          act = act.map(v => v / s);

          let psi = 0, aportes = [];
          act.forEach((a, i) => {
            const ap = (a - base[i]) * Math.log(a / base[i]);
            psi += ap; aportes.push(ap);
          });

          const A = 620, H = 190, w = 66;
          let barras = "";
          base.forEach((b, i) => {
            const x = 30 + i * w;
            barras += `<rect x="${x}" y="${168 - b * 480}" width="26" height="${b * 480}" class="w-barra-ref"/>`;
            barras += `<rect x="${x + 28}" y="${168 - act[i] * 480}" width="26"
              height="${act[i] * 480}" class="${aportes[i] > 0.02 ? "w-barra-mal" : "w-barra-on"}"/>`;
          });
          lienzo.innerHTML = svg(A, H,
            barras + eje(26, 168, 606, 168) +
            texto(30, 22, "construcción", "w-t-ref") + texto(30, 38, "período actual", "w-t-a") +
            texto(30, 186, "puntaje bajo") + texto(520, 186, "puntaje alto"));
          const est = psi < 0.10 ? "población estable" : psi < 0.25
            ? "desplazamiento moderado: analizar" : "desplazamiento relevante: revisar el modelo";
          lect.innerHTML = lectura([
            { k: "PSI", v: fmt(psi, 4), alerta: psi >= 0.25 },
            { k: "Diagnóstico", v: est, alerta: psi >= 0.25 },
            { k: "Tramos con aporte alto", v: aportes.filter(a => a > 0.02).length,
              alerta: aportes.filter(a => a > 0.02).length > 0 }
          ]);
        },
        pie: "Prueba a mover la población hacia un lado y luego a concentrarla en el centro. " +
             "Fíjate en algo incómodo: se pueden tener dos tramos claramente distintos y un " +
             "PSI total todavía bajo, porque los movimientos se compensan."
      });
    }
  };

  /* =================================================================
     M07 — Los tres parámetros pesan igual
     ================================================================= */
  const wProvision = {
    titulo: "Pérdida esperada y sus tres parámetros",
    montar(nodo) {
      const EXPOSICION = 4200000000;
      armar(nodo, {
        titulo: this.titulo,
        controles:
          control({ nombre: "pd", etiqueta: "PD", min: 5, max: 150, valor: 32, paso: 1 }) +
          control({ nombre: "lgd", etiqueta: "LGD", min: 10, max: 90, valor: 45 }) +
          control({ nombre: "cf", etiqueta: "Factor de conversión del contingente", min: 0, max: 100, valor: 40 }),
        etiquetaValor: (n, v) => n === "pd" ? fmt(v / 10, 1) + " %" : v + " %",
        dibujar(e, lienzo, lect) {
          const pd = e.pd / 1000, lgd = e.lgd / 100;
          const ead = EXPOSICION * (1 + 0.22 * (e.cf / 100));
          const prov = pd * lgd * ead;
          const baseProv = 0.032 * 0.45 * EXPOSICION * 1.088;

          const A = 620, H = 150;
          const barra = (y, etq, frac, clase) =>
            `<rect x="150" y="${y}" width="${clamp(frac, 0, 1) * 430}" height="24" class="${clase}"/>` +
            texto(20, y + 17, etq);
          lienzo.innerHTML = svg(A, H,
            barra(16, "PD", pd / 0.15, "w-barra-on") +
            barra(52, "LGD", lgd, "w-barra-on") +
            barra(88, "EAD", ead / (EXPOSICION * 1.25), "w-barra-on") +
            `<rect x="150" y="120" width="${clamp(prov / (baseProv * 3), 0, 1) * 430}"
               height="24" class="w-barra-tot"/>` + texto(20, 137, "Provisión"));
          const var_ = prov / baseProv - 1;
          lect.innerHTML = lectura([
            { k: "Provisión", v: "$ " + fmt(prov) },
            { k: "Cobertura de la exposición", v: pct(prov / ead, 2) },
            { k: "Variación contra el cierre", v: (var_ > 0 ? "+" : "") + pct(var_, 1),
              alerta: Math.abs(var_) > 0.15 }
          ]);
        },
        pie: "Baja la PD un 10 % y anótalo. Ahora devuélvela y baja la LGD un 10 %. El efecto " +
             "sobre la provisión es idéntico, porque es un producto. Por eso revisar solo el " +
             "modelo de PD deja fuera la mitad del riesgo."
      });
    }
  };

  /* =================================================================
     M08 — La correlación engorda la cola
     ================================================================= */
  const wPerdidas = {
    titulo: "Distribución de pérdidas, VaR y capital",
    montar(nodo) {
      armar(nodo, {
        titulo: this.titulo,
        controles:
          control({ nombre: "rho", etiqueta: "Correlación entre incumplimientos", min: 0, max: 40, valor: 0 }) +
          control({ nombre: "conf", etiqueta: "Nivel de confianza", min: 90, max: 999, valor: 990, paso: 1 }),
        etiquetaValor: (n, v) => n === "rho" ? fmt(v / 100, 2) : fmt(v / 10, 1) + " %",
        dibujar(e, lienzo, lect) {
          const rho = e.rho / 100, conf = e.conf / 1000;
          const r = azar(30303);
          const N = 6000, pd = 0.032, lgd = 0.45, exp_ = 4200000000;
          const perd = new Array(N);
          for (let i = 0; i < N; i++) {
            const shock = normal(r);
            // Modelo de factor único: un shock común mueve a toda la cartera a la vez
            const z = Math.sqrt(rho) * shock + Math.sqrt(1 - rho) * normal(r);
            const tasa = clamp(pd * Math.exp(z * (0.35 + rho * 1.6) - 0.06), 0, 0.6);
            perd[i] = tasa * lgd * exp_;
          }
          perd.sort((a, b) => a - b);
          const media = perd.reduce((a, b) => a + b, 0) / N;
          const varq = perd[Math.min(N - 1, Math.floor(conf * N))];
          const tope = perd[N - 1] * 1.02;

          const A = 620, H = 190, bins = 44;
          let hist = "";
          const cuenta = new Array(bins).fill(0);
          perd.forEach(p => cuenta[Math.min(bins - 1, Math.floor(p / tope * bins))]++);
          const maxc = Math.max(...cuenta);
          cuenta.forEach((c, i) => {
            const x = 24 + i * 13, alto = (c / maxc) * 140;
            const val = (i + 0.5) / bins * tope;
            hist += `<rect x="${x}" y="${164 - alto}" width="11.5" height="${alto || 0.5}"
              class="${val >= varq ? "w-barra-mal" : "w-barra-on"}"/>`;
          });
          const xm = 24 + (media / tope) * bins * 13, xv = 24 + (varq / tope) * bins * 13;
          lienzo.innerHTML = svg(A, H,
            hist + eje(22, 166, 606, 166) +
            `<line x1="${xm}" y1="14" x2="${xm}" y2="166" class="w-optimo"/>` +
            `<line x1="${xv}" y1="14" x2="${xv}" y2="166" class="w-corte"/>` +
            texto(xm + 5, 26, "esperada → provisión", "w-optimo-t") +
            texto(clamp(xv - 150, 24, 420), 46, "VaR → capital", "w-corte-t"));
          lect.innerHTML = lectura([
            { k: "Pérdida esperada", v: "$ " + fmt(media) },
            { k: "VaR al " + fmt(conf * 100, 1) + " %", v: "$ " + fmt(varq) },
            { k: "Pérdida inesperada", v: "$ " + fmt(varq - media) },
            { k: "Capital sobre la media", v: fmt((varq - media) / media, 2) + " veces",
              alerta: (varq - media) / media > 1.5 }
          ]);
        },
        pie: "Con correlación cero, la distribución es estrecha y el capital exigido es " +
             "modesto. Súbela a 0,20 y observa: la pérdida esperada casi no se mueve, pero la " +
             "cola se estira y el capital se multiplica. Ese supuesto no se ve en ningún dato " +
             "observado y decide la cifra."
      });
    }
  };

  /* ---------- Registro y montaje ----------------------------------- */

  const REGISTRO = {
    ventana: wVentana, binning: wBinning, complejidad: wComplejidad,
    segmentos: wSegmentos, corte: wCorte, psi: wPsi,
    provision: wProvision, perdidas: wPerdidas
  };

  global.ACWidgets = {
    registro: REGISTRO,
    montarTodos(raiz) {
      (raiz || document).querySelectorAll("[data-widget]").forEach(n => {
        const w = REGISTRO[n.dataset.widget];
        if (!w) { n.innerHTML = '<p class="ac-riesgo">Simulador no disponible.</p>'; return; }
        try { w.montar(n); }
        catch (err) {
          n.innerHTML = '<p class="ac-riesgo">No se pudo cargar el simulador.</p>';
          if (global.console) console.error("Widget", n.dataset.widget, err);
        }
      });
    }
  };
})(window);

</script>

<script>

      <p>Con una planilla puedes revisar mil operaciones. La cartera tiene cuatrocientas mil. Ese es todo el motivo.</p>
      <table class="ac-tabla"><thead><tr><th>Lo que haces en Excel</th><th>Cómo se llama acá</th></tr></thead><tbody><tr><td>Abrir un archivo</td><td>Leer un CSV</td></tr><tr><td>Una hoja con filas y columnas</td><td>Un DataFrame</td></tr><tr><td>Filtrar con autofiltro</td><td>Filtrar por condición</td></tr><tr><td>Tabla dinámica</td><td>Agrupar y resumir</td></tr><tr><td>Una fórmula en una columna nueva</td><td>Crear una columna</td></tr><tr><td>BUSCARV</td><td>Unir dos tablas</td></tr></tbody></table>
      <div class="ac-nota"><strong>Lo que este módulo no es</strong>No es un curso de programación. No vas a aprender a construir sistemas ni te van a pedir que memorices nada. El objetivo es que puedas abrir el código de un laboratorio, entender qué hace cada línea y cambiar un número para ver qué pasa.</div>
    </div>
    <div class="ac-cedula-pie">

  <section class="ac-cedula" data-cedula="0-2">
    <div class="ac-cedula-encab">

      <p>El resultado aparece justo debajo de la celda. Una celda es como una fórmula de Excel: escribes algo, lo ejecutas y ves el resultado. La diferencia es que aquí puedes escribir varias instrucciones seguidas.</p>

  <section class="ac-cedula" data-cedula="0-3">
    <div class="ac-cedula-encab">
      <span class="ref">0-3</span>
      <h3>Tu primera línea</h3>
    </div>
    <div class="ac-cedula-cuerpo">
      <p>Empecemos por lo más simple que existe. Escribe esto en una celda y ejecútalo.</p>
      <div class="ac-codigo"><div class="ac-codigo-encab"><span>Python</span><em>La primera línea</em></div><pre><code>print("Hola")</code></pre></div>
      <p>Debajo aparece la palabra Hola. Eso es todo lo que hace \`print\`: mostrar en pantalla lo que le pongas entre paréntesis. Nada más. Lo vas a usar durante todo el curso para ver resultados.</p>
      <p>Ahora algo con más sentido para nosotros:</p>
      <div class="ac-codigo"><div class="ac-codigo-encab"><span>Python</span><em>Guardar un valor y usarlo</em></div><pre><code>saldo = 1500000
tasa_provision = 0.032

provision = saldo * tasa_provision
print(provision)</code></pre></div>

    <div class="ac-cedula-cuerpo">
      <p>Un modelo se equivoca en casos individuales por definición: estima probabilidades, no certezas. Que rechace a un cliente que habría pagado no es una falla. La falla es equivocarse de forma sistemática.</p>
      <ul><li>Sesgo: se equivoca siempre en la misma dirección, por ejemplo subestimando la probabilidad de incumplimiento de un segmento completo.</li><li>Inestabilidad: funcionaba y dejó de funcionar porque la población cambió.</li><li>Fuga de información: parece funcionar porque usa datos que no existían al momento de decidir.</li><li>Desalineación: funciona, pero no se usa como fue diseñado, por ejemplo con un punto de corte que no corresponde a la política vigente.</li></ul>

      <p>Vamos a obtener el número que usa el simulador de arriba, pero con la cartera del curso. Tres pasos, cada uno de pocas líneas.</p>

      <p>shape responde cuántas filas y columnas hay. head muestra las primeras cinco filas para confirmar que se leyó bien. Nunca sigas sin haber mirado esto: buena parte de los errores de un análisis vienen de un archivo que no traía lo que se creía.</p>

      <p>La primera línea crea una columna que vale 1 cuando la mora llega a noventa días y 0 cuando no. astype(int) convierte el verdadero o falso en uno o cero, que es lo que permite sumarlos. El umbral de noventa días es una definición, no un hecho: si la entidad usa otro, se cambia ahí y todo lo demás se recalcula.</p>

  <div class="ac-avance">
    <div class="ac-avance-riel"><div class="ac-avance-lleno" id="ac-avance-lleno"></div></div>

  </div>

  <div class="ac-nota" style="margin-bottom:var(--e-6)">
    <strong>Qué se lleva de este módulo</strong>Revisar cómo se eligen y transforman las variables de un modelo de score, y detectar las tres fallas que más se repiten en esa etapa: correlación mal medida, tramos hechos por conveniencia y modelos ajustados a su propia muestra.
  </div>

  <section class="ac-cedula" data-cedula="B-1">
    <div class="ac-cedula-encab">
      <span class="ref">B-1</span>
      <h3>Selección de variables: por qué la correlación no alcanza</h3>
    </div>
    <div class="ac-cedula-cuerpo">
      <p>El primer filtro de un modelo es descartar variables redundantes. El error frecuente es aplicar correlación de Pearson a todo el conjunto sin mirar la naturaleza de cada variable. Pearson mide asociación lineal entre variables continuas; aplicada a variables cualitativas o a continuas ya tramificadas, entrega un número que no significa lo que el modelador cree.</p>
      <blockquote class="ac-cita">Hay que tener en cuenta la naturaleza de las variables a la hora de analizarlas por correlación, sobre todo cuando son cualitativas, porque la correlación de Pearson por sí sola no ayuda.<cite>Clase 2, aprox. 00:13:05</cite></blockquote>
      <div class="ac-riesgo"><strong>Qué sale mal</strong>Dos variables que miden lo mismo sobreviven al filtro porque su correlación calculada fue baja. El modelo queda con multicolinealidad, los coeficientes se vuelven inestables y basta un cambio menor de muestra para que cambien de signo.</div>
      <div class="ac-nota"><strong>Procedimiento</strong>Solicitar la matriz de correlación junto con el diccionario de variables y verificar que el estadístico usado corresponde al tipo de variable. Para pares categórica-categórica corresponde V de Cramér o chi cuadrado; para categórica-continua, razón de correlación. Documentar el umbral de descarte y confirmar que se aplicó de forma consistente.</div>
    </div>
    <div class="ac-cedula-pie">
      <button class="ac-btn ac-btn-secundario" data-marcar="B-1">Marcar cédula revisada</button>
      <span class="ac-marca-aud" data-marca-de="B-1"></span>
    </div>
  </section>

  <section class="ac-cedula" data-cedula="B-2">
    <div class="ac-cedula-encab">
      <span class="ref">B-2</span>
      <h3>Weight of evidence: qué mide y cómo se lee</h3>
    </div>
    <div class="ac-cedula-cuerpo">
      <p>El weight of evidence, o WOE, se calcula por tramo de una variable. Compara la proporción de clientes buenos que caen en ese tramo con la proporción de clientes malos que caen en el mismo tramo, y toma el logaritmo de esa razón. Un WOE positivo indica concentración de buenos; uno negativo, de malos.</p>
      <blockquote class="ac-cita">El WOE se define a nivel de cada tramo: el logaritmo de la proporción de buenos en la categoría sobre el total de buenos, contra la proporción equivalente de malos.<cite>Clase 2, aprox. 00:19:57</cite></blockquote>
      <p>La utilidad para auditoría es que el WOE hace visible el comportamiento de la variable tramo por tramo. Una variable puede tener buen poder predictivo global y aun así comportarse de forma incoherente en un tramo específico.</p>
      <table class="ac-tabla"><thead><tr><th>Tramo de antigüedad</th><th>Buenos</th><th>Malos</th><th>WOE</th><th>Lectura</th></tr></thead><tbody><tr><td>Menos de 6 meses</td><td class="num">1.200</td><td class="num">480</td><td class="num">-0,62</td><td>Concentra malos</td></tr><tr><td>6 a 24 meses</td><td class="num">3.400</td><td class="num">610</td><td class="num">0,18</td><td>Cerca del promedio</td></tr><tr><td>24 a 60 meses</td><td class="num">4.100</td><td class="num">390</td><td class="num">0,71</td><td>Concentra buenos</td></tr><tr><td>Más de 60 meses</td><td class="num">2.300</td><td class="num">340</td><td class="num">0,41</td><td>Rompe la monotonía</td></tr></tbody></table>
      <div class="ac-riesgo"><strong>Qué sale mal</strong>El último tramo baja en lugar de seguir subiendo. Si el modelador no lo explica, hay dos posibilidades: el tramo tiene pocos casos y el WOE es ruido, o la variable no se comporta como el negocio supone. Ambas exigen respuesta antes de aceptar el modelo.</div>
      <div class="ac-nota"><strong>Procedimiento</strong>Pedir la tabla de WOE por variable con el conteo de casos por tramo. Marcar todo tramo con menos del 5 % de la población y todo quiebre de monotonía sin justificación escrita en la documentación del modelo.</div>
    </div>
    <div class="ac-cedula-pie">
      <button class="ac-btn ac-btn-secundario" data-marcar="B-2">Marcar cédula revisada</button>
      <span class="ac-marca-aud" data-marca-de="B-2"></span>
    </div>
  </section>

  <section class="ac-cedula" data-cedula="B-3">
    <div class="ac-cedula-encab">
      <span class="ref">B-3</span>
      <h3>Information value: el umbral que se puede citar</h3>
    </div>
    <div class="ac-cedula-cuerpo">
      <p>Mientras el WOE describe cada tramo, el information value resume en un solo número el poder predictivo de la variable completa. Se usa para decidir qué variables entran al modelo, y es especialmente habitual en regresión logística binaria y en modelos de score.</p>
      <blockquote class="ac-cita">El information value mide la predicción del atributo, y es muy útil cuando se trabaja con regresiones logísticas binarias, en particular para un modelo de score.<cite>Clase 2, aprox. 00:15:17</cite></blockquote>
      <div class="ac-umbral"><strong>Rangos de referencia del information value</strong>Bajo 0,02 la variable no aporta. Entre 0,02 y 0,10 el aporte es débil. Entre 0,10 y 0,30 es aceptable. Entre 0,30 y 0,50 es fuerte. Sobre 0,50 hay que sospechar: una variable así de predictiva suele contener información que no estaba disponible al momento de decidir.</div>
      <div class="ac-riesgo"><strong>Qué sale mal</strong>El caso clásico es una variable con IV superior a 0,8 que resulta ser el estado de morosidad del propio período que se quiere predecir. El modelo luce excelente en desarrollo y no sirve en producción, porque esa variable no existe cuando hay que decidir sobre un cliente nuevo.</div>
      <div class="ac-nota"><strong>Procedimiento</strong>Listar las variables con IV sobre 0,50 y para cada una reconstruir el momento en que el dato queda disponible. Contrastarlo con la fecha de la decisión de crédito. Si el dato es posterior, hay fuga de información y el desempeño reportado está sobrestimado.</div>
    </div>
    <div class="ac-cedula-pie">
      <button class="ac-btn ac-btn-secundario" data-marcar="B-3">Marcar cédula revisada</button>
      <span class="ac-marca-aud" data-marca-de="B-3"></span>
    </div>
  </section>

  <section class="ac-cedula" data-cedula="B-4">
    <div class="ac-cedula-encab">
      <span class="ref">B-4</span>
      <h3>Binning: dónde se pierde la trazabilidad</h3>
    </div>
    <div class="ac-cedula-cuerpo">
      <p>Convertir una variable continua en tramos se llama binning. Existen rutinas de binning óptimo que buscan automáticamente los cortes que maximizan el information value. El problema es que el óptimo estadístico y el óptimo de gestión no coinciden.</p>
      <blockquote class="ac-cita">El binning óptimo maximiza la diferencia a través del information value. El problema de ese óptimo es que maximiza los grupos: busca muchos grupos.<cite>Clase 2, aprox. 00:29:06</cite></blockquote>
      <p>Muchos tramos elevan el IV en la muestra de desarrollo y al mismo tiempo dejan tramos con pocos casos, que son los primeros en volverse inestables cuando la cartera cambia. Un modelo con veinte tramos por variable es un modelo difícil de explicar a un comité y difícil de monitorear.</p>
      <div class="ac-umbral"><strong>Criterio práctico de revisión</strong>Entre cuatro y seis tramos por variable, cada uno con al menos 5 % de la población, y WOE monótono salvo justificación de negocio documentada.</div>
      <div class="ac-riesgo"><strong>Qué sale mal</strong>Los cortes se rehacen sobre la misma muestra hasta que el modelo alcanza la métrica que el comité quería ver. No queda registro de los cortes descartados y el resultado es un modelo ajustado a su propia muestra.</div>
      <div class="ac-nota"><strong>Procedimiento</strong>Solicitar la bitácora de construcción del binning: cortes probados, criterio de selección y quién los aprobó. La ausencia de esa bitácora es en sí misma un hallazgo de control interno, independiente de la calidad estadística del modelo.</div>
      <div data-widget="binning"></div>
    </div>
    <div class="ac-cedula-pie">
      <button class="ac-btn ac-btn-secundario" data-marcar="B-4">Marcar cédula revisada</button>
      <span class="ac-marca-aud" data-marca-de="B-4"></span>
    </div>
  </section>

  <section class="ac-cedula" data-cedula="B-5">
    <div class="ac-cedula-encab">
      <span class="ref">B-5</span>
      <h3>Del modelo al scorecard: odds, puntos y escala</h3>
    </div>
    <div class="ac-cedula-cuerpo">
      <p>La salida de una regresión logística es una probabilidad. Una probabilidad de 0,037 no es un número con el que un comité de crédito trabaje cómodamente. Por eso se aplica una transformación lineal que lleva esa probabilidad a una escala de puntos: eso es la scorecard.</p>
      <blockquote class="ac-cita">La probabilidad no siempre es fácil de interpretar en un comité. Por eso se instauró la scorecard, que es hacer una transformación lineal de las probabilidades a una escala entendible.<cite>Clase 2, aprox. 00:56:32</cite></blockquote>
      <p>El odds es la razón entre buenos y malos de la población. Si por cada veinte clientes buenos hay uno malo, el odds es veinte a uno. La escala se define fijando un puntaje de referencia para un odds dado y los puntos necesarios para duplicar ese odds.</p>
      <table class="ac-tabla"><thead><tr><th>Atributo del solicitante</th><th>Puntos</th></tr></thead><tbody><tr><td>Base de la escala</td><td class="num">83</td></tr><tr><td>Sexo declarado: hombre</td><td class="num">98</td></tr><tr><td>Línea disponible entre 2,5 y 4,5 veces el ingreso</td><td class="num">93</td></tr><tr><td>Puntaje total del ejemplo</td><td class="num">274</td></tr></tbody></table>
      <div class="ac-riesgo"><strong>Qué sale mal</strong>La escala es una transformación, no información nueva. Reescalar no mejora un modelo malo: solo lo hace ver ordenado. Un scorecard bien presentado puede esconder un modelo con discriminación insuficiente.</div>
      <div class="ac-nota"><strong>Procedimiento</strong>Verificar que el puntaje de corte usado en la operación corresponde a la probabilidad que la política de crédito dice aceptar. Es frecuente que la escala se recalibre y el punto de corte quede en el valor antiguo, aprobando clientes que la política vigente rechazaría.</div>
      <div class="ac-riesgo"><strong>Atributos sensibles</strong>Cuando la scorecard asigna puntos por sexo, edad, nacionalidad o domicilio, hay que verificar si la normativa aplicable lo permite y si existe evaluación de trato diferenciado. Es un riesgo regulatorio y reputacional, no solo estadístico.</div>
    </div>
    <div class="ac-cedula-pie">
      <button class="ac-btn ac-btn-secundario" data-marcar="B-5">Marcar cédula revisada</button>
      <span class="ac-marca-aud" data-marca-de="B-5"></span>
    </div>
  </section>

  <section class="ac-cedula" data-cedula="B-6">
    <div class="ac-cedula-encab">
      <span class="ref">B-6</span>
      <h3>Sobreajuste y regularización</h3>
    </div>
    <div class="ac-cedula-cuerpo">
      <p>Un modelo sobreajustado es el que funciona muy bien sobre la población con la que se construyó y falla al aplicarse a otra. Es el riesgo central de toda la etapa de construcción, y por eso importa el binning, el número de variables y la separación entre muestra de desarrollo y de validación.</p>
      <blockquote class="ac-cita">Cuando trato de perfeccionar tanto el modelo, ese modelo tiende a sobreajustarse: funciona muy bien para la población con la que se construyó, pero no cuando se aplica a una población diferente.<cite>Clase 2, aprox. 01:17:07</cite></blockquote>
      <p>Ridge y Lasso son técnicas de regularización: penalizan los coeficientes grandes para que el modelo generalice mejor y para reducir multicolinealidad. Lasso además puede llevar coeficientes exactamente a cero, con lo que selecciona variables.</p>
      <div class="ac-umbral"><strong>Señal de alerta</strong>Una caída del área bajo la curva superior a cinco puntos porcentuales entre la muestra de desarrollo y la de validación indica sobreajuste y exige explicación.</div>
      <div class="ac-nota"><strong>Procedimiento</strong>Pedir las métricas de desempeño calculadas por separado en desarrollo y en validación, con el detalle de cómo se dividió la muestra. Si solo existe una cifra global, el modelo no fue validado: fue descrito.</div>
    </div>
    <div class="ac-cedula-pie">
      <button class="ac-btn ac-btn-secundario" data-marcar="B-6">Marcar cédula revisada</button>
      <span class="ac-marca-aud" data-marca-de="B-6"></span>
    </div>
  </section>

  <section class="ac-cedula" data-cedula="B-7">
    <div class="ac-cedula-encab">
      <span class="ref">B-7</span>
      <h3>Laboratorio: calcular el information value</h3>
    </div>
    <div class="ac-cedula-cuerpo">
      <p>El simulador mostró qué pasa al mover el número de tramos. Ahora hacemos el cálculo sobre la cartera. Empecemos por lo más simple: partir una variable en tramos.</p>
      <div class="ac-codigo"><div class="ac-codigo-encab"><span>Python</span><em>Paso 1. Partir en cinco tramos de igual tamaño</em></div><pre><code>import pandas as pd

cartera["tramo"] = pd.qcut(cartera["antiguedad_meses"], 5)
print(cartera["tramo"].value_counts())</code></pre></div>
      <p>qcut corta en cinco grupos con la misma cantidad de operaciones cada uno. value_counts confirma que quedaron parejos. Cambia el 5 por 15 y mira cómo se achican: eso es lo que mostraba el simulador.</p>
      <div class="ac-codigo"><div class="ac-codigo-encab"><span>Python</span><em>Paso 2. Contar buenos y malos en cada tramo</em></div><pre><code>t = cartera.groupby("tramo", observed=True)["malo"].agg(["count", "sum"])
t.columns = ["total", "malos"]
t["buenos"] = t["total"] - t["malos"]
print(t)</code></pre></div>
      <p>Es la tabla dinámica del Módulo 0: agrupar por tramo, contar cuántos hay y cuántos incumplieron. Los buenos son la resta. Con esta tabla ya se calcula todo lo demás.</p>
      <div class="ac-codigo"><div class="ac-codigo-encab"><span>Python</span><em>Paso 3. WOE e information value</em></div><pre><code>import numpy as np

t["p_buenos"] = t["buenos"] / t["buenos"].sum()
t["p_malos"] = t["malos"] / t["malos"].sum()

t["woe"] = np.log(t["p_buenos"] / t["p_malos"])
t["iv"] = (t["p_buenos"] - t["p_malos"]) * t["woe"]

print(t[["total", "woe", "iv"]].round(4))
print(f"IV total = {t['iv'].sum():.4f}")</code></pre></div>
      <p>Cada tramo aporta su parte y el information value es la suma. El WOE es el logaritmo de la razón entre la proporción de buenos y la de malos del tramo: positivo cuando concentra buenos, negativo cuando concentra malos. No hace falta recordar la fórmula, pero sí saber que sale de esa tabla de conteos.</p>
      <div class="ac-riesgo"><strong>Si aparece un error de división por cero</strong>Ocurre cuando un tramo no tiene ningún incumplimiento. La solución habitual es sumar medio caso a cada conteo antes de dividir, lo que se llama corrección de continuidad. Que el error aparezca ya es información: ese tramo es demasiado pequeño.</div>
      <div class="ac-codigo"><div class="ac-codigo-encab"><span>Python</span><em>Los dos controles de la cédula</em></div><pre><code>participacion = t["total"] / t["total"].sum()
print("Tramos bajo el 5 % de la población:", (participacion &lt; 0.05).sum())

if t["iv"].sum() &gt; 0.50:
    print("IV alto: verificar cuándo queda disponible esta variable")</code></pre></div>
    </div>

  <div class="ac-avance">

  <div class="ac-nota" style="margin-bottom:var(--e-6)">
    <strong>Qué se lleva de este módulo</strong>Decidir cuándo un modelo más complejo que la regresión logística se justifica y cuándo es un riesgo. El criterio no es cuál predice mejor, sino cuál se puede explicar, reproducir y monitorear.
  </div>

  <section class="ac-cedula" data-cedula="C-1">
    <div class="ac-cedula-encab">
      <span class="ref">C-1</span>
      <h3>Por qué aparecen los árboles y qué cambian</h3>
    </div>
    <div class="ac-cedula-cuerpo">
      <p>La regresión logística impone una forma: el efecto de cada variable es monótono y se suma al de las demás. Un árbol de decisión no impone esa forma. Divide la población en grupos mediante cortes sucesivos y captura interacciones que la logística solo reproduce si alguien las declara explícitamente.</p>
      <p>Esa flexibilidad tiene un costo. Un árbol profundo puede separar casi perfectamente la muestra de desarrollo y perder gran parte de ese desempeño fuera de ella. Es el mismo sobreajuste del módulo anterior, con más capacidad de producirlo.</p>
      <div class="ac-nota"><strong>Lo que cambia para el auditor</strong>En una logística se revisa el signo y la magnitud de cada coeficiente. En un árbol no hay coeficientes: se revisa la estructura de cortes, la profundidad, el mínimo de casos por hoja y la estabilidad de esas reglas entre muestras.</div>
    </div>
    <div class="ac-cedula-pie">
      <button class="ac-btn ac-btn-secundario" data-marcar="C-1">Marcar cédula revisada</button>
      <span class="ac-marca-aud" data-marca-de="C-1"></span>
    </div>
  </section>

  <section class="ac-cedula" data-cedula="C-2">
    <div class="ac-cedula-encab">
      <span class="ref">C-2</span>
      <h3>Bagging y boosting: qué se gana y qué se pierde</h3>
    </div>
    <div class="ac-cedula-cuerpo">
      <p>Un árbol solo es inestable. Las técnicas de ensamble combinan muchos árboles para estabilizar el resultado. Bagging los entrena en paralelo sobre remuestreos y promedia; boosting los entrena en secuencia, cada uno corrigiendo los errores del anterior.</p>
      <table class="ac-tabla"><thead><tr><th>Enfoque</th><th>Cómo combina</th><th>Fortaleza</th><th>Riesgo dominante</th></tr></thead><tbody><tr><td>Árbol único</td><td>No combina</td><td>Reglas legibles</td><td>Inestabilidad</td></tr><tr><td>Bagging</td><td>Promedio en paralelo</td><td>Reduce varianza</td><td>Pierde legibilidad</td></tr><tr><td>Boosting</td><td>Secuencial y ponderado</td><td>Mayor desempeño</td><td>Sobreajuste y sensibilidad al ruido</td></tr></tbody></table>
      <div class="ac-riesgo"><strong>Qué sale mal</strong>Boosting persigue los errores de los pasos anteriores. Si la muestra contiene registros con errores de carga o períodos anómalos, el modelo dedica capacidad a ajustar precisamente esos casos. El resultado luce mejor en desarrollo y se deteriora rápido en producción.</div>
      <div class="ac-nota"><strong>Procedimiento</strong>Antes de evaluar el desempeño de un ensamble, revisar la depuración de la muestra. Un modelo de boosting sobre datos sucios amplifica la suciedad en lugar de promediarla.</div>
    </div>
    <div class="ac-cedula-pie">
      <button class="ac-btn ac-btn-secundario" data-marcar="C-2">Marcar cédula revisada</button>
      <span class="ac-marca-aud" data-marca-de="C-2"></span>
    </div>
  </section>

  <section class="ac-cedula" data-cedula="C-3">
    <div class="ac-cedula-encab">
      <span class="ref">C-3</span>
      <h3>Interpretabilidad: el requisito que no es negociable</h3>
    </div>
    <div class="ac-cedula-cuerpo">
      <p>Una institución debe poder explicar por qué rechazó una solicitud, tanto al cliente como al supervisor. Un modelo cuya decisión no se puede descomponer en razones concretas genera un problema operativo antes que estadístico.</p>
      <p>La regresión logística con scorecard resuelve esto de forma natural: el puntaje es una suma de puntos atribuibles a atributos concretos. Un ensamble de cientos de árboles requiere herramientas adicionales de atribución, y esas herramientas son aproximaciones, no la decisión real del modelo.</p>
      <div class="ac-riesgo"><strong>Qué sale mal</strong>La institución adopta un modelo de mayor desempeño y mantiene la scorecard anterior solo para explicar decisiones. Se termina con dos modelos: uno que decide y otro que justifica. La explicación entregada al cliente no corresponde al criterio que se aplicó.</div>
      <div class="ac-nota"><strong>Procedimiento</strong>Verificar que el modelo que produce la decisión es el mismo que genera la razón de rechazo comunicada. Solicitar diez casos rechazados y reconstruir la razón entregada al cliente desde la salida del modelo en producción.</div>
    </div>
    <div class="ac-cedula-pie">
      <button class="ac-btn ac-btn-secundario" data-marcar="C-3">Marcar cédula revisada</button>
      <span class="ac-marca-aud" data-marca-de="C-3"></span>
    </div>
  </section>

  <section class="ac-cedula" data-cedula="C-4">
    <div class="ac-cedula-encab">
      <span class="ref">C-4</span>
      <h3>Criterio de aceptación de un modelo más complejo</h3>
    </div>
    <div class="ac-cedula-cuerpo">
      <p>La pregunta no es si el modelo complejo predice mejor. Casi siempre predice algo mejor en la muestra de desarrollo. La pregunta es si esa mejora sobrevive en validación y si compensa el costo de explicarlo, mantenerlo y monitorearlo.</p>
      <div class="ac-umbral"><strong>Regla de decisión propuesta</strong>Se acepta el modelo más complejo si la mejora de área bajo la curva en la muestra de validación, no en desarrollo, supera tres puntos porcentuales y se mantiene en una ventana fuera de tiempo. Por debajo de eso, la ganancia no compensa la pérdida de interpretabilidad.</div>
      <ol><li>Comparar ambos modelos sobre exactamente la misma muestra de validación.</li><li>Verificar que la partición de datos fue idéntica y con la misma semilla.</li><li>Repetir la comparación sobre una ventana temporal posterior.</li><li>Estimar el efecto de la diferencia sobre la provisión, no solo sobre la métrica.</li><li>Documentar la decisión y los responsables que la aprobaron.</li></ol>
      <div class="ac-riesgo"><strong>Qué sale mal</strong>Se comparan modelos evaluados sobre muestras distintas o con particiones diferentes. La comparación no es válida y la decisión de reemplazo queda sin sustento.</div>

  <section class="ac-cedula" data-cedula="C-5">
    <div class="ac-cedula-encab">

      <h3>Reproducibilidad: el hallazgo más frecuente</h3>
    </div>
    <div class="ac-cedula-cuerpo">
      <p>Un modelo de aprendizaje automático depende de una semilla aleatoria, de versiones específicas de librerías y del orden de los datos de entrada. Si alguno de esos elementos no está documentado, el modelo no se puede reproducir y, por lo tanto, no se puede validar de forma independiente.</p>
      <div class="ac-umbral"><strong>Elementos mínimos del expediente del modelo</strong>Semilla utilizada, versión del lenguaje y de cada librería, criterio y semilla de la partición de la muestra, hiperparámetros finales, fecha de extracción de los datos y responsable de cada paso.</div>

      <div class="ac-riesgo"><strong>Qué sale mal</strong>El modelo se entrenó en el equipo de un analista que ya no está en la institución, con versiones de librerías que nadie registró. El modelo sigue operando y nadie puede reconstruirlo. Es una observación de continuidad operacional, además de una limitación al alcance de la validación.</div>
    </div>

  <section class="ac-cedula" data-cedula="C-6">

      <h3>Laboratorio: comparar dos modelos</h3>
    </div>
    <div class="ac-cedula-cuerpo">
      <p>El simulador mostró la brecha entre desarrollo y validación. Aquí se mide de verdad, con dos modelos sobre la misma cartera.</p>
      <div class="ac-codigo"><div class="ac-codigo-encab"><span>Python</span><em>Paso 1. Separar la muestra en dos</em></div><pre><code>from sklearn.model_selection import train_test_split

SEMILLA = 20260722

X = cartera[["antiguedad_meses", "carga_financiera", "renta"]]
y = cartera["malo"]

X_des, X_val, y_des, y_val = train_test_split(
    X, y, test_size=0.2, stratify=y, random_state=SEMILLA)

print(len(X_des), "para desarrollo y", len(X_val), "para validación")</code></pre></div>
      <p>X son las variables que explican; y es lo que se quiere predecir. La función reparte 80 y 20. stratify mantiene la misma proporción de incumplimientos en ambas partes. random_state es la semilla: fija el sorteo para que mañana salga idéntico. Sin ella, dos ejecuciones dan resultados distintos y nadie puede replicar el trabajo.</p>
      <div class="ac-codigo"><div class="ac-codigo-encab"><span>Python</span><em>Paso 2. Entrenar el modelo simple y medirlo</em></div><pre><code>from sklearn.linear_model import LogisticRegression
from sklearn.metrics import roc_auc_score

logistica = LogisticRegression(max_iter=1000)
logistica.fit(X_des, y_des)

auc_des = roc_auc_score(y_des, logistica.predict_proba(X_des)[:, 1])
auc_val = roc_auc_score(y_val, logistica.predict_proba(X_val)[:, 1])
print(f"Logística  desarrollo {auc_des:.3f}   validación {auc_val:.3f}")</code></pre></div>
      <p>fit es entrenar: el modelo mira los datos de desarrollo y ajusta sus coeficientes. predict_proba devuelve la probabilidad de cada operación, y [:, 1] toma la columna de la probabilidad de incumplir. roc_auc_score la compara contra lo que pasó de verdad.</p>
      <div class="ac-codigo"><div class="ac-codigo-encab"><span>Python</span><em>Paso 3. El mismo procedimiento con un modelo complejo</em></div><pre><code>from sklearn.ensemble import GradientBoostingClassifier

boosting = GradientBoostingClassifier(random_state=SEMILLA)
boosting.fit(X_des, y_des)

b_des = roc_auc_score(y_des, boosting.predict_proba(X_des)[:, 1])
b_val = roc_auc_score(y_val, boosting.predict_proba(X_val)[:, 1])
print(f"Boosting   desarrollo {b_des:.3f}   validación {b_val:.3f}")
print(f"Brecha logística {auc_des - auc_val:+.3f}   boosting {b_des - b_val:+.3f}")</code></pre></div>
      <div class="ac-nota"><strong>Cómo se lee</strong>Lo que decide la adopción es la columna de validación. La brecha de cada modelo dice cuánto sobreajustó. Si el boosting gana un punto en validación y sobreajusta diez, la ganancia no compensa lo que se pierde en interpretabilidad y mantenimiento.</div>

      <p>Segmentar es agrupar clientes u operaciones de modo que dentro de cada grupo el comportamiento sea parecido y entre grupos sea distinto. No hay una variable objetivo: es el algoritmo el que propone los grupos a partir de las características observadas.</p>

      <p>El efecto contable es directo: en los modelos de pérdida esperada se estima un conjunto de parámetros por segmento. Si los segmentos están mal definidos, los parámetros se calculan sobre poblaciones heterogéneas y la provisión resultante no refleja el riesgo de ninguna de ellas.</p>
      <div class="ac-nota"><strong>La pregunta de auditoría</strong>¿La segmentación responde a diferencias reales de comportamiento de pago o a la estructura comercial de la institución? Segmentar por línea de negocio es cómodo para gestionar y frecuentemente inadecuado para provisionar.</div>

      <p>El primer elemento de una segmentación es la medida de distancia: el criterio numérico para decidir si dos cuentas se parecen. Cambiar la medida de distancia cambia los grupos, aun con los mismos datos.</p>
      <blockquote class="ac-cita">Los elementos más importantes dentro de la segmentación son primero las medidas de distancia o de proximidad, que son las medidas estadísticas o numéricas que se van a utilizar para definir si una cuenta se parece a otra.<cite>Clase 4, aprox. 00:03:49</cite></blockquote>
      <table class="ac-tabla"><thead><tr><th>Familia</th><th>Cómo agrupa</th><th>Cuándo se usa</th></tr></thead><tbody><tr><td>Jerárquico</td><td>Aglomera o divide por orden de distancia</td><td>Exploración, carteras pequeñas</td></tr><tr><td>No jerárquico (k-medias)</td><td>Asigna a centroides y los recalcula</td><td>Carteras grandes, producción</td></tr></tbody></table>
      <p>Dentro de los métodos jerárquicos, el criterio de enlace también altera el resultado: vecino más próximo, vecino más lejano, distancia del centroide o método de Ward producen agrupaciones distintas sobre los mismos datos.</p>

    <div class="ac-cedula-cuerpo">
      <p>El número de grupos no lo entrega el algoritmo: lo elige quien construye el modelo. Existen dos apoyos habituales para esa decisión, y ninguno de los dos entrega una respuesta única.</p>
      <blockquote class="ac-cita">Hay dos métodos que son los más comunes: el método del codo y el gráfico de la silueta.<cite>Clase 4, aprox. 00:49:55</cite></blockquote>

      <div class="ac-umbral"><strong>Criterio de revisión</strong>El número elegido debe estar justificado por al menos uno de los dos métodos y cada segmento debe contener volumen suficiente para estimar sus parámetros de riesgo. Un segmento con muy pocos incumplimientos no permite estimar una probabilidad de incumplimiento confiable, por más nítida que sea su separación.</div>

      <div class="ac-codigo"><div class="ac-codigo-encab"><span>Python</span><em>Paso 1. Estandarizar, que es el paso que se olvida</em></div><pre><code>from sklearn.preprocessing import StandardScaler

Z = StandardScaler().fit_transform(cartera[variables])

print(Z[:3])   # las tres primeras filas ya transformadas</code></pre></div>
      <p>Estandarizar deja todas las variables en la misma escala: cada una pasa a medirse en desviaciones respecto de su propio promedio. Sin este paso, el monto en pesos aplasta a la antigüedad en meses y los grupos se forman por la unidad de medida.</p>

from sklearn.metrics import silhouette_score

for k in range(2, 9):
    km = KMeans(n_clusters=k, n_init=10, random_state=20260722).fit(Z)
    print(f"k={k}   silueta {silhouette_score(Z, km.labels_):.3f}")</code></pre></div>
      <p>El bucle repite lo mismo para cada valor de k. La silueta mide qué tan separados quedan los grupos: más alto es mejor. No entrega una respuesta única, solo un apoyo para la decisión.</p>

cartera["segmento"] = km.labels_

perfil = cartera.groupby("segmento").agg(
    operaciones=("malo", "size"),
    incumplimientos=("malo", "sum"),
    tasa=("malo", "mean"))
print(perfil.round(4))

print(perfil[perfil["incumplimientos"] &lt; 30])</code></pre></div>

    <strong>Qué se lleva de este módulo</strong>Leer las métricas y los gráficos con que un equipo de riesgo justifica su modelo, y saber cuáles admiten conclusión y cuáles solo describen la muestra con que se construyó.

  <section class="ac-cedula" data-cedula="E-1">
    <div class="ac-cedula-encab">
      <span class="ref">E-1</span>
      <h3>Discriminación: qué mide realmente la curva ROC</h3>
    </div>
    <div class="ac-cedula-cuerpo">
      <p>La curva ROC responde una sola pregunta: si tomo al azar un cliente que incumplió y uno que no, ¿con qué frecuencia el modelo le asigna peor puntaje al que incumplió? El área bajo esa curva es esa frecuencia. No dice si la probabilidad estimada es correcta en nivel, solo si el orden es correcto.</p>
      <blockquote class="ac-cita">En términos de curva ROC, los modelos sobre 80 % son todos buenos.<cite>Clase 5, aprox. 00:50:16</cite></blockquote>
      <div class="ac-umbral"><strong>Referencia de discriminación</strong>Un área bajo la curva de 0,50 equivale a no discriminar. Bajo 0,70 el modelo es insuficiente para decisiones de crédito. Entre 0,70 y 0,80 es aceptable con reservas. Sobre 0,80 se considera bueno. Sobre 0,95 hay que sospechar fuga de información antes de celebrar.</div>
      <p>El índice de Gini expresa lo mismo en otra escala: es dos veces el área bajo la curva menos uno. Un área de 0,84 equivale a un Gini de 0,68. No son dos evidencias distintas: es la misma cifra presentada dos veces.</p>
      <div class="ac-riesgo"><strong>Qué sale mal</strong>El informe presenta área bajo la curva, Gini y KS como si fueran tres confirmaciones independientes del desempeño. Las dos primeras son la misma medida; el KS aporta una lectura distinta, pero también sobre la misma capacidad de ordenar.</div>
    </div>
