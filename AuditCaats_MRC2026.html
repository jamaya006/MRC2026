<title>Programa MRC-2026 · AuditCaat's Data Assurance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@400;500;600;700&family=Source+Sans+3:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ===================================================================
   AuditCaat's Data Assurance — Tokens de marca
   Este es el UNICO archivo que se toca para cambiar identidad visual.
   Si cambia la paleta corporativa, se edita aqui y se propaga a todo
   el programa (portal, los ocho modulos, certificados y diploma).
   =================================================================== */

:root {
  /* --- Superficies: metafora de papel de trabajo -------------------- */
  --ac-papel:      #E7ECF2;  /* fondo general: hoja ledger */
  --ac-cedula:     #FCFDFE;  /* superficie de cedula / tarjeta */
  --ac-papel-2:    #DDE5EE;  /* zonas hundidas, encabezados de tabla */
  --ac-rayado:     #C6D3E0;  /* lineas del ledger, bordes */
  --ac-rayado-2:   #9FB2C6;  /* bordes activos */

  /* --- Tinta -------------------------------------------------------- */
  --ac-tinta:      #16202C;  /* texto principal */
  --ac-tinta-2:    #47586B;  /* texto secundario */
  --ac-tinta-3:    #7C8DA0;  /* metadatos, folios */

  /* --- Color institucional ------------------------------------------ */
  --ac-marca:      #12594F;  /* verde profundo AuditCaat's */
  --ac-marca-alto: #0C443C;
  --ac-marca-suave:#E3EFEC;

  /* --- Marcas de auditoria (lapiz rojo del revisor) ------------------ */
  --ac-tick:       #B0182D;
  --ac-tick-suave: #FBE9EC;

  /* --- Señales ------------------------------------------------------- */
  --ac-alerta:     #8A5B00;  /* observacion / hallazgo */
  --ac-alerta-bg:  #FBF2DE;
  --ac-ok:         #1A6B3C;
  --ac-ok-bg:      #E4F2E9;
  --ac-bloqueo:    #8C97A3;

  /* --- Tipografia ---------------------------------------------------- */
  --ac-display: "Zilla Slab", "Bitter", Georgia, serif;
  --ac-texto:   "Source Sans 3", "Source Sans Pro", -apple-system, "Segoe UI", sans-serif;
  --ac-dato:    "IBM Plex Mono", "SFMono-Regular", Consolas, monospace;

  /* --- Escala tipografica -------------------------------------------- */
  --t-xs:  0.72rem;
  --t-sm:  0.84rem;
  --t-md:  1rem;
  --t-lg:  1.18rem;
  --t-xl:  1.55rem;
  --t-2xl: 2.1rem;
  --t-3xl: 2.9rem;

  /* --- Ritmo ---------------------------------------------------------- */
  --e-1: 4px;  --e-2: 8px;  --e-3: 12px; --e-4: 16px;
  --e-5: 24px; --e-6: 32px; --e-7: 48px; --e-8: 72px;

  --radio: 3px;              /* casi recto: es un formulario, no una app */
  --sombra: 0 1px 2px rgba(22,32,44,.07), 0 6px 18px rgba(22,32,44,.06);
  --sombra-alta: 0 2px 4px rgba(22,32,44,.10), 0 14px 34px rgba(22,32,44,.11);
}

/* ===================================================================
   AuditCaat's — Estilo compartido del programa
   Depende de ac_marca.css. No definir colores literales aqui.
   =================================================================== */

*, *::before, *::after { box-sizing: border-box; }

html { -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  font-family: var(--ac-texto);
  font-size: var(--t-md);
  line-height: 1.65;
  color: var(--ac-tinta);
  background-color: var(--ac-papel);
  /* rayado de hoja contable, discreto */
  background-image: repeating-linear-gradient(
      to bottom, transparent 0 31px, rgba(159,178,198,.20) 31px 32px);
}

h1, h2, h3, h4 { font-family: var(--ac-display); font-weight: 600; line-height: 1.2; margin: 0; }
p { margin: 0 0 var(--e-4); }
a { color: var(--ac-marca); text-decoration-thickness: 1px; text-underline-offset: 3px; }
a:hover { color: var(--ac-marca-alto); }

:focus-visible {
  outline: 2px solid var(--ac-tick);
  outline-offset: 2px;
}

.ac-envoltura { max-width: 1080px; margin: 0 auto; padding: 0 var(--e-5); }
.ac-angosto   { max-width: 760px;  margin: 0 auto; padding: 0 var(--e-5); }

/* ---------- Encabezado institucional -------------------------------- */
.ac-cabecera {
  background: var(--ac-tinta);
  color: #fff;
  border-bottom: 3px solid var(--ac-marca);
}
.ac-cabecera-fila {
  display: flex; align-items: center; gap: var(--e-4);
  padding: var(--e-4) 0;
}
.ac-logo {
  width: 46px; height: 46px; flex: none;
  background-size: contain;
  background-image: var(--ac-logo);
  background-size: contain; background-repeat: no-repeat; background-position: center;
  display: grid; place-items: center;
  font-family: var(--ac-display); font-size: var(--t-lg); color: #fff;
  border: 1px solid rgba(255,255,255,.30); border-radius: var(--radio);
}
.ac-logo.tiene-imagen { border-color: transparent; width: 156px; height: 39px;
  background-position: left center; }
.ac-logo.tiene-imagen span { display: none; }
.ac-cabecera-txt strong { display: block; font-family: var(--ac-display); font-size: var(--t-lg); letter-spacing: .01em; }
.ac-cabecera-txt small { color: rgba(255,255,255,.68); font-size: var(--t-xs); letter-spacing: .10em; text-transform: uppercase; }
.ac-cabecera-fin { margin-left: auto; text-align: right; font-family: var(--ac-dato); font-size: var(--t-xs); color: rgba(255,255,255,.72); }

/* ---------- Portada del programa ------------------------------------ */
.ac-portada { padding: var(--e-8) 0 var(--e-6); }
.ac-eyebrow {
  font-family: var(--ac-dato); font-size: var(--t-xs);
  letter-spacing: .18em; text-transform: uppercase; color: var(--ac-tinta-3);
  margin-bottom: var(--e-3);
}
.ac-portada h1 { font-size: var(--t-3xl); max-width: 20ch; margin-bottom: var(--e-4); }
.ac-portada .bajada { font-size: var(--t-lg); color: var(--ac-tinta-2); max-width: 62ch; }

.ac-fichaprograma {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 1px; background: var(--ac-rayado);
  border: 1px solid var(--ac-rayado); border-radius: var(--radio);
  margin-top: var(--e-6); overflow: hidden;
}
.ac-fichaprograma div { background: var(--ac-cedula); padding: var(--e-4); }
.ac-fichaprograma dt { font-size: var(--t-xs); text-transform: uppercase; letter-spacing: .10em; color: var(--ac-tinta-3); }
.ac-fichaprograma dd { margin: var(--e-1) 0 0; font-family: var(--ac-display); font-size: var(--t-xl); }

/* ---------- INDICE DE LEGAJO (elemento firma) -----------------------
   La ruta del programa no se ve como un carrusel de tarjetas: se ve
   como el indice de un legajo de auditoria, con referencia, folio,
   estado y columna de marcas.
   ------------------------------------------------------------------ */
.ac-legajo {
  background: var(--ac-cedula);
  border: 1px solid var(--ac-rayado-2);
  border-radius: var(--radio);
  box-shadow: var(--sombra);
  margin: var(--e-6) 0 var(--e-8);
  overflow: hidden;
}
.ac-legajo-encab {
  display: flex; align-items: baseline; gap: var(--e-3);
  padding: var(--e-4) var(--e-5);
  border-bottom: 2px solid var(--ac-tinta);
  background: var(--ac-papel-2);
}
.ac-legajo-encab h2 { font-size: var(--t-lg); }
.ac-legajo-encab span { margin-left: auto; font-family: var(--ac-dato); font-size: var(--t-xs); color: var(--ac-tinta-2); }

.ac-fila {
  display: grid;
  grid-template-columns: 62px 1fr 132px 96px 54px;
  align-items: center;
  gap: var(--e-4);
  padding: var(--e-4) var(--e-5);
  border-bottom: 1px solid var(--ac-rayado);
  text-decoration: none; color: inherit;
  position: relative;
  transition: background .14s ease;
}
.ac-fila:last-child { border-bottom: 0; }
.ac-fila:hover, .ac-fila:focus-visible { background: var(--ac-marca-suave); }
.ac-fila[aria-disabled="true"] { background: repeating-linear-gradient(135deg, transparent 0 9px, rgba(159,178,198,.13) 9px 18px); cursor: not-allowed; }
.ac-fila[aria-disabled="true"]:hover { background: repeating-linear-gradient(135deg, transparent 0 9px, rgba(159,178,198,.13) 9px 18px); }
.ac-fila[aria-disabled="true"] .ac-fila-tit { color: var(--ac-bloqueo); }

.ac-ref {
  font-family: var(--ac-dato); font-size: var(--t-sm); font-weight: 600;
  color: var(--ac-tinta); border: 1px solid var(--ac-rayado-2);
  border-radius: var(--radio); padding: 2px 0; text-align: center;
  background: var(--ac-papel);
}
.ac-fila-tit { font-family: var(--ac-display); font-size: var(--t-lg); }
.ac-fila-sub { font-size: var(--t-sm); color: var(--ac-tinta-2); }
.ac-fila-meta { font-family: var(--ac-dato); font-size: var(--t-xs); color: var(--ac-tinta-3); }

.ac-estado {
  font-size: var(--t-xs); font-weight: 600; letter-spacing: .06em; text-transform: uppercase;
  padding: 3px 8px; border-radius: var(--radio); display: inline-block; white-space: nowrap;
}
.ac-estado.pendiente { background: var(--ac-papel-2); color: var(--ac-tinta-2); }
.ac-estado.curso     { background: var(--ac-alerta-bg); color: var(--ac-alerta); }
.ac-estado.aprobado  { background: var(--ac-ok-bg); color: var(--ac-ok); }
.ac-estado.bloqueado { background: transparent; color: var(--ac-bloqueo); border: 1px dashed var(--ac-rayado-2); }

/* Marca de auditoria estampada */
.ac-marca-aud {
  font-family: var(--ac-display); font-size: 1.6rem; line-height: 1;
  color: var(--ac-tick); text-align: center;
  transform: rotate(-9deg);
  opacity: 0; transition: opacity .25s ease;
}
.ac-marca-aud.puesta { opacity: 1; }
@media (prefers-reduced-motion: no-preference) {
  .ac-marca-aud.puesta { animation: ac-estampar .34s cubic-bezier(.2,1.5,.4,1) both; }
}
@keyframes ac-estampar {
  0%   { opacity: 0; transform: rotate(-9deg) scale(2.4); }
  70%  { opacity: 1; transform: rotate(-9deg) scale(.92); }
  100% { opacity: 1; transform: rotate(-9deg) scale(1); }
}

/* ---------- Barra de avance ------------------------------------------ */
.ac-avance { display: flex; align-items: center; gap: var(--e-3); margin-top: var(--e-2); }
.ac-avance-riel { flex: 1; height: 6px; background: var(--ac-papel-2); border-radius: 99px; overflow: hidden; }
.ac-avance-lleno { height: 100%; background: var(--ac-marca); width: 0; transition: width .4s ease; }
.ac-avance small { font-family: var(--ac-dato); font-size: var(--t-xs); color: var(--ac-tinta-2); }

/* ---------- Cedula (bloque de contenido dentro de un modulo) --------- */
.ac-cedula {
  background: var(--ac-cedula);
  border: 1px solid var(--ac-rayado-2);
  border-radius: var(--radio);
  box-shadow: var(--sombra);
  margin: 0 0 var(--e-6);
  overflow: hidden;
}
.ac-cedula-encab {
  display: flex; align-items: center; gap: var(--e-3);
  padding: var(--e-3) var(--e-5);
  background: var(--ac-papel-2);
  border-bottom: 1px solid var(--ac-rayado-2);
}
.ac-cedula-encab .ref { font-family: var(--ac-dato); font-size: var(--t-sm); font-weight: 600; color: var(--ac-marca); }
.ac-cedula-encab h3 { font-size: var(--t-lg); flex: 1; }
.ac-cedula-cuerpo { padding: var(--e-5); }
.ac-cedula-cuerpo > :last-child { margin-bottom: 0; }
.ac-cedula-pie {
  display: flex; align-items: center; gap: var(--e-3);
  padding: var(--e-3) var(--e-5);
  border-top: 1px dashed var(--ac-rayado-2);
  background: var(--ac-papel);
  font-size: var(--t-sm); color: var(--ac-tinta-2);
}

/* Recuadros didacticos */
.ac-nota, .ac-riesgo, .ac-umbral {
  border-left: 3px solid; padding: var(--e-4) var(--e-4) var(--e-4) var(--e-5);
  margin: 0 0 var(--e-4); border-radius: 0 var(--radio) var(--radio) 0;
}
.ac-nota   { border-color: var(--ac-marca); background: var(--ac-marca-suave); }
.ac-riesgo { border-color: var(--ac-alerta); background: var(--ac-alerta-bg); }
.ac-umbral { border-color: var(--ac-tick);  background: var(--ac-tick-suave); }
.ac-nota  strong, .ac-riesgo strong, .ac-umbral strong { display: block; font-family: var(--ac-display); margin-bottom: var(--e-1); }

.ac-cita {
  font-size: var(--t-sm); color: var(--ac-tinta-2);
  border-left: 2px solid var(--ac-rayado-2); padding-left: var(--e-4);
  font-style: italic; margin: 0 0 var(--e-4);
}
.ac-cita cite { display: block; font-style: normal; font-family: var(--ac-dato); font-size: var(--t-xs); color: var(--ac-tinta-3); margin-top: var(--e-2); }

/* ---------- Simuladores ---------------------------------------------- */
.ac-widget {
  margin: 0 0 var(--e-5);
  border: 1px solid var(--ac-rayado-2);
  border-radius: var(--radio);
  background: var(--ac-cedula);
  overflow: hidden;
}
.ac-w-encab {
  display: flex; align-items: baseline; gap: var(--e-3);
  padding: var(--e-2) var(--e-4);
  background: var(--ac-tinta); color: #fff;
  font-family: var(--ac-dato); font-size: var(--t-xs);
}

const AC_PROGRAMA = {

/* ---------------------------------------------------------------
   Backend. Reemplazar por la URL del despliegue vigente de Apps
   Script. Usar SIEMPRE "Nueva version" sobre el mismo despliegue;
   crear un despliegue nuevo cambia la URL y rompe la verificacion
   de los certificados ya emitidos.
   --------------------------------------------------------------- */
const AC_BACKEND = "";  // ej: https://script.google.com/a/macros/auditcaats.com/s/XXXX/exec

/* ===================================================================
   AuditCaat's — Motor del programa  (ac_engine.js)
   Requiere: ac_programa.js cargado antes que este archivo.

   Responsabilidades
     1. Guardar y recuperar al participante y su avance
     2. Renderizar el indice de legajo del portal
     3. Gestionar cedulas y estampado de marcas dentro de un modulo
     4. Renderizar y calificar la evaluacion (con barajado de opciones)
     5. Emitir certificado por modulo y diploma de programa
     6. Sincronizar con el backend de Apps Script

   Corregir un defecto aqui lo corrige en los ocho modulos.
   =================================================================== */

(function (global) {
  "use strict";

  /* ---------------------------------------------------------------
     1. Almacenamiento tolerante a fallos
     localStorage puede no estar disponible (modo privado, iframe con
     restricciones, visor de archivos). En ese caso se degrada a
     memoria: la sesion funciona igual, pero no persiste al cerrar.
     --------------------------------------------------------------- */
  const Store = (function () {
    const CLAVE = "auditcaats.programa.v1";
    let memoria = null;
    let hayDisco = false;
    try {
      const p = "__ac_probe__";
      localStorage.setItem(p, "1");
      localStorage.removeItem(p);
      hayDisco = true;
    } catch (e) { hayDisco = false; }

    function leer() {
      if (memoria) return memoria;
      if (hayDisco) {
        try {
          const crudo = localStorage.getItem(CLAVE);
          memoria = crudo ? JSON.parse(crudo) : estadoInicial();
        } catch (e) { memoria = estadoInicial(); }
      } else {
        memoria = estadoInicial();
      }
      return memoria;
    }
    function escribir(estado) {
      memoria = estado;
      if (!hayDisco) return false;
      try { localStorage.setItem(CLAVE, JSON.stringify(estado)); return true; }
      catch (e) { return false; }
    }
    function estadoInicial() {
      return { participante: null, modulos: {}, diploma: null, version: 1 };
    }
    return { leer, escribir, persistente: () => hayDisco, reiniciar: () => escribir(estadoInicial()) };
  })();

  /* ---------------------------------------------------------------
     2. Utilidades
     --------------------------------------------------------------- */

  // Hash determinista (FNV-1a de 32 bits). Mismo participante y mismo
  // modulo producen siempre el mismo codigo de verificacion.
  function hash32(txt) {
    let h = 0x811c9dc5;
    for (let i = 0; i < txt.length; i++) {
      h ^= txt.charCodeAt(i);
      h = (h + ((h << 1) + (h << 4) + (h << 7) + (h << 8) + (h << 24))) >>> 0;
    }
    return h >>> 0;
  }
  function base32(n, largo) {
    const A = "ABCDEFGHJKMNPQRSTUVWXYZ23456789"; // sin I, L, O, 0, 1
    let s = "";
    for (let i = 0; i < largo; i++) { s = A[n % A.length] + s; n = Math.floor(n / A.length); }
    return s;
  }
  // Formato AC-2026-XXXXX-XXXX, compatible con los certificados ya emitidos
  function generarCodigo(participante, moduloId) {
    const semilla = [participante.documento, participante.nombre, moduloId, AC_PROGRAMA.codigo]
      .join("|").toUpperCase().replace(/\s+/g, " ").trim();
    const a = hash32(semilla);
    const b = hash32(semilla + "#2");
    return "AC-" + AC_PROGRAMA.anio + "-" + base32(a, 5) + "-" + base32(b, 4);
  }

  // Serializacion con claves ordenadas: dos objetos equivalentes producen
  // siempre el mismo texto, condicion necesaria para que la firma sea estable.
  function estable(v) {
    if (v === null || typeof v !== "object") return JSON.stringify(v);
    if (Array.isArray(v)) return "[" + v.map(estable).join(",") + "]";
    return "{" + Object.keys(v).sort().map(k =>
      JSON.stringify(k) + ":" + estable(v[k])).join(",") + "}";
  }

  // Firma de integridad del respaldo. Detecta edicion manual del archivo.
  // No es un mecanismo criptografico: el algoritmo viaja en el navegador y
  // alguien decidido puede recalcularla. Sirve para que un archivo alterado
  // por descuido no pase inadvertido.
  function firmar(datos) {
    const base = estable({
      participante: datos.participante,
      modulos: datos.modulos,
      diploma: datos.diploma
    });
    return hash32(base).toString(36).toUpperCase() + "-" +
           hash32(base + AC_PROGRAMA.codigo).toString(36).toUpperCase();
  }

  // Fisher-Yates. Sin esto, todas las respuestas correctas terminan
  // en la misma posicion y el participante aprueba por patron.
  function barajar(arr) {
    const c = arr.slice();
    for (let i = c.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [c[i], c[j]] = [c[j], c[i]];
    }
    return c;
  }

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, m =>
      ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m]));
  }
  function hoy() {
    return new Date().toLocaleDateString("es-CL", { day: "2-digit", month: "long", year: "numeric" });
  }
  const $ = (sel, raiz) => (raiz || document).querySelector(sel);
  const $$ = (sel, raiz) => Array.prototype.slice.call((raiz || document).querySelectorAll(sel));

  /* ---------------------------------------------------------------
     3. Participante
     --------------------------------------------------------------- */
  const Participante = {
    obtener() { return Store.leer().participante; },
    registrar(datos) {
      const e = Store.leer();
      e.participante = {
        nombre: datos.nombre.trim(),
        documento: datos.documento.trim().toUpperCase(),
        email: datos.email.trim().toLowerCase(),
        cargo: datos.cargo,
        organizacion: datos.organizacion.trim(),
        alta: new Date().toISOString()

      Store.escribir(e);
      return e.participante;
    },
    salir() { Store.reiniciar(); }
  };

  /* ---------------------------------------------------------------
     4. Progreso
     Estructura por modulo:
       { cedulas: {A1:true,...}, puntaje: 0, maximo: 0, aprobado: false,
         certificado: {codigo, fecha}, convalidado: false }
     --------------------------------------------------------------- */
  const Progreso = {
    modulo(id) {
      const e = Store.leer();
      if (!e.modulos[id]) {
        e.modulos[id] = { cedulas: {}, puntaje: 0, maximo: 0, aprobado: false, certificado: null };
        Store.escribir(e);
      }
      return e.modulos[id];
    },
    guardar(id, parcial) {
      const e = Store.leer();
      e.modulos[id] = Object.assign(this.modulo(id), parcial);
      Store.escribir(e);
      return e.modulos[id];
    },
    marcarCedula(moduloId, cedulaId) {
      const m = this.modulo(moduloId);
      m.cedulas[cedulaId] = true;
      this.guardar(moduloId, m);
      return m;
    },
    // Un modulo se abre si el anterior esta aprobado. El primero siempre abierto.
    disponible(moduloId) {
      const idx = AC_PROGRAMA.modulos.findIndex(m => m.id === moduloId);
      if (idx <= 0) return true;
      const previo = AC_PROGRAMA.modulos[idx - 1];
      return !!this.modulo(previo.id).aprobado;
    },
    aprobados() {
      return AC_PROGRAMA.modulos.filter(m => this.modulo(m.id).aprobado).length;
    },
    programaCompleto() {
      const publicados = AC_PROGRAMA.modulos.filter(m => m.estadoPublicacion === "publicado");
      return publicados.length === AC_PROGRAMA.modulos.length &&
             this.aprobados() === AC_PROGRAMA.modulos.length;
    },
    // Convalida el Modulo I a quien ya tiene certificado emitido, sin
    // obligarlo a repetir el curso.
    convalidar(moduloId, codigo) {
      if (!/^AC-\d{4}-[A-Z0-9]{5}-[A-Z0-9]{4}$/.test(codigo.trim().toUpperCase())) return false;
      const p = Participante.obtener();
      if (!p) return false;
      this.guardar(moduloId, {
        aprobado: true, convalidado: true,
        certificado: { codigo: codigo.trim().toUpperCase(), fecha: hoy(), convalidado: true }
      });
      return true;
    }
  };

  /* ---------------------------------------------------------------
     5. Evaluacion
     Banco esperado:
       [{ id:"q1", texto:"...", puntaje:10,
          opciones:[{txt:"...", ok:true}, ...],
          retro:"por que la correcta es la correcta" }]
     --------------------------------------------------------------- */
  const Quiz = {
    render(contenedor, banco) {
      const nodo = typeof contenedor === "string" ? $(contenedor) : contenedor;
      if (!nodo) return;
      nodo.innerHTML = banco.map((p, i) => {
        const ops = barajar(p.opciones.map((o, k) => Object.assign({ _k: k }, o)));
        return '<div class="ac-pregunta" data-q="' + esc(p.id) + '">' +
          '<div class="ac-pregunta-num">Pregunta ' + (i + 1) + ' de ' + banco.length +
          '  ·  ' + (p.puntaje || 10) + ' puntos</div>' +
          '<div class="ac-pregunta-txt">' + esc(p.texto) + '</div>' +
          ops.map(o =>
            '<label class="ac-opcion">' +
            '<input type="radio" name="' + esc(p.id) + '" value="' + (o.ok ? "1" : "0") + '">' +
            '<span>' + esc(o.txt) + '</span></label>').join("") +
          '<div class="ac-retro">' + esc(p.retro || "") + '</div>' +
          '</div>';
      }).join("");
      nodo.dataset.banco = "listo";
    },

    calificar(contenedor, banco) {
      const nodo = typeof contenedor === "string" ? $(contenedor) : contenedor;
      let puntaje = 0, maximo = 0, sinResponder = 0;

      banco.forEach(p => {
        const val = p.puntaje || 10;
        maximo += val;
        const bloque = $('[data-q="' + p.id + '"]', nodo);
        const marcado = $('input[name="' + p.id + '"]:checked', bloque);
        if (!marcado) { sinResponder++; }
        else if (marcado.value === "1") { puntaje += val; }

        $$(".ac-opcion", bloque).forEach(op => {
          const inp = $("input", op);
          if (inp.value === "1") op.classList.add("correcta");
          else if (inp.checked) op.classList.add("incorrecta");
          inp.disabled = true;
        });
        $(".ac-retro", bloque).classList.add("visible");
      });

      return { puntaje, maximo, sinResponder, razon: maximo ? puntaje / maximo : 0 };
    }
  };

  /* ---------------------------------------------------------------
     6. Certificacion
     --------------------------------------------------------------- */
  const Certificado = {
    emitirModulo(moduloId) {
      const p = Participante.obtener();
      if (!p) return null;
      const m = Progreso.modulo(moduloId);
      if (!m.aprobado) return null;
      if (m.certificado) return m.certificado;

      const cert = {
        tipo: "modulo",
        modulo: moduloId,
        codigo: generarCodigo(p, moduloId),
        fecha: hoy(),
        emision: new Date().toISOString(),
        puntaje: m.puntaje,
        maximo: m.maximo
      };
      Progreso.guardar(moduloId, { certificado: cert });
      Backend.registrar(cert, p);
      return cert;
    },

    emitirDiploma() {
      const p = Participante.obtener();
      if (!p || !Progreso.programaCompleto()) return null;
      const e = Store.leer();
      if (e.diploma) return e.diploma;

      const total = AC_PROGRAMA.modulos.reduce((a, m) => {
        const r = Progreso.modulo(m.id);
        return { p: a.p + (r.puntaje || 0), x: a.x + (r.maximo || 0) };
      }, { p: 0, x: 0 });

      e.diploma = {
        tipo: "programa",
        modulo: AC_PROGRAMA.codigo,
        codigo: generarCodigo(p, AC_PROGRAMA.codigo),
        fecha: hoy(),
        emision: new Date().toISOString(),
        puntaje: total.p, maximo: total.x,
        horas: AC_PROGRAMA.horasTotales
      };
      Store.escribir(e);
      Backend.registrar(e.diploma, p);
      return e.diploma;
    },

    urlLinkedIn(cert, tituloModulo) {
      const q = new URLSearchParams({
        startTask: "CERTIFICATION_NAME",
        name: tituloModulo,
        organizationName: AC_PROGRAMA.emisor,
        issueYear: String(new Date().getFullYear()),
        issueMonth: String(new Date().getMonth() + 1),
        certId: cert.codigo
      });
      if (AC_BACKEND) q.set("certUrl", AC_BACKEND + "?verificar=" + cert.codigo);
      return "https://www.linkedin.com/profile/add?" + q.toString();
    },

    descargarConstancia(cert) {
      const p = Participante.obtener();
      const blob = new Blob([JSON.stringify({ programa: AC_PROGRAMA.codigo, participante: p, certificado: cert }, null, 2)],
        { type: "application/json" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "constancia_" + cert.codigo + ".json";
      a.click();
      URL.revokeObjectURL(a.href);
    }
  };

  /* ---------------------------------------------------------------
     7. Backend
     Envio sin CORS: Apps Script no responde encabezados CORS a fetch
     con JSON. Se envia como texto plano en modo no-cors; la respuesta
     no se lee, por eso el registro local manda y el backend solo
     acumula para verificacion publica.
     --------------------------------------------------------------- */
  const Backend = {
    registrar(cert, participante) {
      if (!AC_BACKEND) return Promise.resolve({ ok: false, motivo: "sin backend configurado" });
      const carga = {
        accion: "emitir",
        programa: AC_PROGRAMA.codigo,
        certificado: cert,
        participante: {
          nombre: participante.nombre, documento: participante.documento,
          email: participante.email, cargo: participante.cargo,
          organizacion: participante.organizacion
        }
      };
      return fetch(AC_BACKEND, {
        method: "POST", mode: "no-cors",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(carga)
      }).then(() => ({ ok: true })).catch(err => ({ ok: false, motivo: String(err) }));
    }
  };

  /* ---------------------------------------------------------------
     8. Respaldo del avance
     Sustituye al backend para uso interno: el participante descarga su
     avance y lo restaura en otro equipo o despues de limpiar el
     navegador. El coordinador recibe esos archivos y consolida.
     --------------------------------------------------------------- */
  const Respaldo = {
    armar() {
      const e = Store.leer();
      const datos = {
        formato: "auditcaats.avance",
        version: 1,
        programa: AC_PROGRAMA.codigo,
        generado: new Date().toISOString(),
        participante: e.participante,
        modulos: e.modulos,
        diploma: e.diploma
      };
      datos.firma = firmar(datos);
      return datos;
    },

    descargar() {
      const p = Participante.obtener();
      if (!p) return null;
      const datos = this.armar();
      const nombre = "avance_" + AC_PROGRAMA.codigo + "_" +
        p.documento.replace(/[^A-Za-z0-9]/g, "") + "_" +
        new Date().toISOString().slice(0, 10) + ".json";

      const blob = new Blob([JSON.stringify(datos, null, 2)], { type: "application/json" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = nombre;
      a.click();
      URL.revokeObjectURL(a.href);
      return nombre;
    },

    /** Valida la estructura y la firma. No modifica nada. */
    revisar(texto) {
      let d;
      try { d = JSON.parse(texto); }
      catch (err) { return { ok: false, motivo: "El archivo no es un JSON válido." }; }

      if (d.formato !== "auditcaats.avance")
        return { ok: false, motivo: "El archivo no es un respaldo de avance de este programa." };
      if (!d.participante || !d.participante.documento)
        return { ok: false, motivo: "El respaldo no identifica al participante." };
      if (d.programa !== AC_PROGRAMA.codigo)
        return { ok: false, motivo: "El respaldo corresponde a otro programa (" + d.programa + ")." };

      const alterado = d.firma !== firmar(d);
      return { ok: true, datos: d, alterado: alterado };
    },

    /**
     * Restaura un respaldo sobre el estado actual.
     * @param {string} texto contenido del archivo
     * @param {boolean} reemplazarParticipante permite cambiar de titular
     */
    restaurar(texto, reemplazarParticipante) {
      const r = this.revisar(texto);
      if (!r.ok) return r;

      const e = Store.leer();
      const actual = e.participante;
      const entra = r.datos.participante;

      if (actual && actual.documento !== entra.documento && !reemplazarParticipante) {
        return { ok: false, distinto: true, entrante: entra, actual: actual,
                 motivo: "El respaldo pertenece a " + entra.nombre + "." };
      }

      e.participante = entra;

      // Fusion conservadora: se toma lo mejor de cada lado, nunca se pierde
      // un modulo ya aprobado ni un puntaje superior.
      Object.keys(r.datos.modulos || {}).forEach(id => {
        const nuevo = r.datos.modulos[id];
        const previo = e.modulos[id];
        if (!previo) { e.modulos[id] = nuevo; return; }
        e.modulos[id] = {
          cedulas: Object.assign({}, previo.cedulas, nuevo.cedulas),
          puntaje: Math.max(previo.puntaje || 0, nuevo.puntaje || 0),
          maximo: Math.max(previo.maximo || 0, nuevo.maximo || 0),
          aprobado: !!(previo.aprobado || nuevo.aprobado),
          convalidado: !!(previo.convalidado || nuevo.convalidado),
          certificado: previo.certificado || nuevo.certificado || null
        };
      });

      if (!e.diploma && r.datos.diploma) e.diploma = r.datos.diploma;

      const guardado = Store.escribir(e);
      const aprobados = AC_PROGRAMA.modulos.filter(m => e.modulos[m.id] && e.modulos[m.id].aprobado).length;
      return { ok: true, alterado: r.alterado, participante: entra,
               aprobados: aprobados, persistido: guardado };
    },

    /** Resume un respaldo para la vista de seguimiento del equipo. */
    resumir(datos) {
      const mods = datos.modulos || {};
      const detalle = AC_PROGRAMA.modulos.map(m => {
        const r = mods[m.id] || {};
        return { id: m.id, ref: m.ref, aprobado: !!r.aprobado,
                 puntaje: r.puntaje || 0, maximo: r.maximo || 0,
                 codigo: r.certificado ? r.certificado.codigo : "" };
      });
      const ok = detalle.filter(d => d.aprobado);
      return {
        nombre: datos.participante.nombre,
        documento: datos.participante.documento,
        email: datos.participante.email,
        organizacion: datos.participante.organizacion,
        generado: datos.generado ? datos.generado.slice(0, 10) : "",
        aprobados: ok.length,
        total: AC_PROGRAMA.modulos.length,
        puntaje: ok.reduce((a, d) => a + d.puntaje, 0),
        maximo: ok.reduce((a, d) => a + d.maximo, 0),
        horas: AC_PROGRAMA.modulos
          .filter(m => (mods[m.id] || {}).aprobado)
          .reduce((a, m) => a + m.horas, 0),
        detalle: detalle,
        firmaValida: datos.firma === firmar(datos)
      };
    }
  };

  /* ---------------------------------------------------------------
     9. Portal: indice de legajo
     --------------------------------------------------------------- */
  const Portal = {
    render(sel) {
      const nodo = $(sel);
      if (!nodo) return;

      nodo.innerHTML = AC_PROGRAMA.modulos.map(m => {
        const r = Progreso.modulo(m.id);
        const abierto = Progreso.disponible(m.id);
        const publicado = m.estadoPublicacion === "publicado";
        const habilitado = abierto && publicado;

        let estado = "pendiente", texto = "Pendiente";
        if (r.aprobado) { estado = "aprobado"; texto = r.convalidado ? "Convalidado" : "Aprobado"; }
        else if (!publicado) { estado = "bloqueado"; texto = m.estadoPublicacion === "en produccion" ? "En preparación" : "No publicado"; }
        else if (!abierto) { estado = "bloqueado"; texto = "Requiere " + AC_PROGRAMA.modulos[AC_PROGRAMA.modulos.findIndex(x => x.id === m.id) - 1].ref; }
        else if (Object.keys(r.cedulas).length) { estado = "curso"; texto = "En curso"; }

        const etiqueta = habilitado ? "a" : "div";
        const attrs = habilitado
          ? 'href="' + esc(m.url) + '"'
          : 'aria-disabled="true" tabindex="0" role="link" aria-label="' + esc(m.titulo + ". " + texto) + '"';

        return "<" + etiqueta + ' class="ac-fila" ' + attrs + ">" +
          '<div class="ac-ref">' + esc(m.ref) + "</div>" +
          "<div>" +
            '<div class="ac-fila-tit">' + esc(m.titulo) + "</div>" +
            '<div class="ac-fila-sub">' + esc(m.resumen) + "</div>" +
          "</div>" +
          '<div class="ac-fila-meta">' + m.horas.toFixed(1).replace(".", ",") + " h · " + esc(m.clase) + "<br>" +
            esc(m.entregable) + "</div>" +
          '<div><span class="ac-estado ' + estado + '">' + esc(texto) + "</span></div>" +
          '<div class="ac-marca-aud ' + (r.aprobado ? "puesta" : "") + '">' + (r.aprobado ? esc(m.marca) : "") + "</div>" +
        "</" + etiqueta + ">";
      }).join("");

      this.avance();
    },

    avance() {
      const lleno = $("#ac-avance-lleno");
      const txt = $("#ac-avance-txt");
      if (!lleno) return;
      const n = Progreso.aprobados(), t = AC_PROGRAMA.modulos.length;
      lleno.style.width = (n / t * 100).toFixed(1) + "%";
      if (txt) txt.textContent = n + " de " + t + " módulos aprobados";
    }
  };

  /* ---------------------------------------------------------------
     10. API publica
     --------------------------------------------------------------- */
  // Rutas de navegacion. El empaquetador de archivo unico las reemplaza
  // por rutas de hash para que el mismo runtime sirva en ambos formatos.
  const Rutas = {
    cert: id => "../certificado.html?modulo=" + id,
    diploma: () => "certificado.html?tipo=programa",
    indice: () => "../index.html",
    equipo: () => "seguimiento.html"
  };

  global.AC = {
    programa: AC_PROGRAMA,
    Rutas,
    Store, Participante, Progreso, Quiz, Certificado, Backend, Portal, Respaldo,
    util: { esc, hoy, barajar, generarCodigo, estable, firmar, $, $$ },
    moduloPorId: id => AC_PROGRAMA.modulos.find(m => m.id === id)
  };

})(window);

/* ===================================================================
   AuditCaat's — Runtime de pagina de modulo  (ac_modulo.js)
   Requiere ac_programa.js y ac_engine.js.

   Un modulo solo declara su contenido y su banco de preguntas.
   Toda la mecanica vive aqui: marcado de cedulas, habilitacion de la
   evaluacion, calificacion y emision del certificado.
   =================================================================== */

(function (global) {
  "use strict";
  const $ = AC.util.$, $$ = AC.util.$$;

  const ACModulo = {
    iniciar(moduloId, banco) {
      const mod = AC.moduloPorId(moduloId);
      if (!mod) { console.error("Módulo no declarado en ac_programa.js:", moduloId); return; }

      // Sin inscripcion no se abre el modulo: los certificados necesitan
      // los datos del participante.
      if (!AC.Participante.obtener()) {
        location.href = AC.Rutas.indice();
        return;
      }

      this.mod = mod;
      this.banco = banco;

      if (getComputedStyle(document.documentElement).getPropertyValue("--ac-logo").trim() !== "none") {
        const l = $("#logo"); if (l) l.classList.add("tiene-imagen");
      }
      const t = $("#cab-titulo"); if (t) t.textContent = mod.titulo;
      const r = $("#cab-ref");   if (r) r.textContent = "Referencia " + mod.ref + " · " + mod.horas.toFixed(1).replace(".", ",") + " h";
      document.title = mod.titulo + " · AuditCaat's";

      if (global.ACWidgets) ACWidgets.montarTodos(document);
      this.restaurarCedulas();
      this.enlazarBotones();
      AC.Quiz.render("#quiz", banco);
      this.actualizarEstado();

      const btn = $("#btn-calificar");
      if (btn) btn.addEventListener("click", () => this.calificar());
    },

    cedulas() { return $$("[data-cedula]").map(n => n.dataset.cedula); },

    restaurarCedulas() {
      const p = AC.Progreso.modulo(this.mod.id);
      this.cedulas().forEach(id => { if (p.cedulas[id]) this.estampar(id, false); });
    },

    enlazarBotones() {
      $$("[data-marcar]").forEach(b =>
        b.addEventListener("click", () => {
          AC.Progreso.marcarCedula(this.mod.id, b.dataset.marcar);
          this.estampar(b.dataset.marcar, true);
          this.actualizarEstado();
        })
      );
    },

    estampar(cedulaId, animar) {
      const sello = $('[data-marca-de="' + cedulaId + '"]');
      if (sello) {
        sello.textContent = this.mod.marca;
        if (animar) sello.classList.add("puesta");
        else { sello.style.opacity = 1; sello.classList.add("puesta"); }
      }
      const btn = $('[data-marcar="' + cedulaId + '"]');
      if (btn) { btn.disabled = true; btn.textContent = "Cédula revisada"; }
    },

    actualizarEstado() {
      const p = AC.Progreso.modulo(this.mod.id);
      const total = this.cedulas().length;
      const hechas = this.cedulas().filter(id => p.cedulas[id]).length;

      const lleno = $("#ac-avance-lleno"), txt = $("#ac-avance-txt");
      if (lleno) lleno.style.width = (total ? hechas / total * 100 : 0).toFixed(1) + "%";
      if (txt) txt.textContent = hechas + " de " + total + " cédulas revisadas";

      const listo = total > 0 && hechas === total;
      const btn = $("#btn-calificar");
      if (btn && !p.aprobado) btn.disabled = !listo;

      const aviso = $("#eval-aviso");
      if (aviso) {
        aviso.textContent = listo
          ? "Evaluación habilitada. Se aprueba con " + Math.round(AC.programa.aprobacionMinima * 100) + " %."
          : "Faltan " + (total - hechas) + " cédulas para habilitar la evaluación. Se aprueba con " +
            Math.round(AC.programa.aprobacionMinima * 100) + " %.";
      }

      if (p.aprobado) this.mostrarAprobado(p);
    },

    calificar() {
      const r = AC.Quiz.calificar("#quiz", this.banco);

      if (r.sinResponder > 0) {
        // Se califica igual: dejar preguntas en blanco es una decision del
        // participante, no un error del sistema. Solo se informa.
        $("#resultado").textContent = r.sinResponder + " pregunta(s) sin responder. ";
      }

      const aprobado = r.razon >= AC.programa.aprobacionMinima;
      AC.Progreso.guardar(this.mod.id, {
        puntaje: r.puntaje, maximo: r.maximo, aprobado: aprobado,
        rendido: new Date().toISOString()
      });

      $("#btn-calificar").disabled = true;
      const res = $("#resultado");
      res.textContent += r.puntaje + " / " + r.maximo + "  ·  " + Math.round(r.razon * 100) + " %  ·  " +
        (aprobado ? "Aprobado" : "No aprobado");
      res.style.color = aprobado ? "var(--ac-ok)" : "var(--ac-tick)";

      if (aprobado) {
        const cert = AC.Certificado.emitirModulo(this.mod.id);
        this.mostrarAprobado(AC.Progreso.modulo(this.mod.id));
        if (cert) $("#btn-cert").href = AC.Rutas.cert(this.mod.id);
      } else {
        // Reintento: se rehace el render para barajar de nuevo las opciones.
        const nuevo = document.createElement("button");
        nuevo.className = "ac-btn ac-btn-secundario";
        nuevo.textContent = "Repetir evaluación";
        nuevo.addEventListener("click", () => {
          AC.Quiz.render("#quiz", this.banco);
          res.textContent = "";
          $("#btn-calificar").disabled = false;
          nuevo.remove();
        });
        $("#btn-calificar").parentNode.appendChild(nuevo);
      }
    },

    mostrarAprobado(p) {
      const caja = $("#acciones-cert");
      if (caja) caja.style.display = "block";
      const btn = $("#btn-cert");
      if (btn) btn.href = AC.Rutas.cert(this.mod.id);
      const vol = $("#btn-indice");
      if (vol) vol.href = AC.Rutas.indice();
      const b = $("#btn-calificar");
      if (b) b.disabled = true;
    }
  };

  global.ACModulo = ACModulo;
})(window);

/* ===================================================================
   AuditCaat's — Vista del certificado  (ac_cert.js)
   Usada por certificado.html y por el empaquetado de archivo unico,
   para que exista una sola definicion del documento emitido.
   =================================================================== */

(function (global) {
  "use strict";

  function logoSrc() {
    const v = getComputedStyle(document.documentElement)
      .getPropertyValue("--ac-logo-tinta").trim();
    if (!v || v === "none") return "";
    // En impresion los fondos CSS no se pintan: el certificado usa <img>.
    return v.replace(/^url\(["']?/, "").replace(/["']?\)$/, "");
  }

  const ACCert = {
    /**
     * @param {Element|string} destino  contenedor donde dibujar
     * @param {Object} opciones  { tipo: "modulo"|"programa", moduloId }
     * @return {Object|null} el certificado dibujado, o null si no existe
     */
    render(destino, opciones) {
      const nodo = typeof destino === "string" ? document.querySelector(destino) : destino;
      const esc = AC.util.esc;
      const p = AC.Participante.obtener();
      if (!nodo || !p) return null;

      let cert, titulo, detalle;

      if (opciones.tipo === "programa") {
        cert = AC.Store.leer().diploma;

                  AC.programa.modulos.length + " módulos";
      } else {
        const mod = AC.moduloPorId(opciones.moduloId);
        if (!mod) return null;
        cert = AC.Progreso.modulo(mod.id).certificado;
        titulo = mod.titulo;
        detalle = "Módulo " + mod.ref + " · " +
                  mod.horas.toFixed(1).replace(".", ",") + " horas lectivas";

      if (!cert) {
        nodo.innerHTML =
          '<div class="ac-angosto" style="padding:var(--e-7) var(--e-5)">' +
          '<div class="ac-cedula"><div class="ac-cedula-cuerpo">' +
          "<p>Todavía no hay un certificado emitido para este módulo en este " +
          "navegador. Complétalo desde el índice, o convalídalo con su código si " +
          "ya lo aprobaste antes.</p></div></div></div>";
        return null;
      }

      const src = logoSrc();
      const verif = AC_BACKEND
        ? "Verificable en " + esc(AC_BACKEND) + "?verificar=" + esc(cert.codigo)
        : "Código de verificación";

      nodo.innerHTML =
        '<div class="ac-cert"><div class="ac-cert-borde">' +
          (src ? '<img class="logo" src="' + src + '" alt="AuditCaat\'s Data Assurance">' : "") +
          '<div class="sub">' + esc(AC.programa.emisor) + "</div>" +
          "<h1>Certificado de aprobación</h1>" +
          '<p style="text-align:center;margin:8mm 0 4mm">Se deja constancia de que</p>' +
          '<div class="nombre">' + esc(p.nombre) + "</div>" +
          '<p style="text-align:center;margin:0 0 8mm">documento ' + esc(p.documento) +
            " · " + esc(p.organizacion) + "</p>" +
          '<p style="text-align:center">aprobó</p>' +
          '<h2 style="text-align:center;font-size:16pt;margin:4mm 0">' + esc(titulo) + "</h2>" +
          '<p style="text-align:center;color:var(--ac-tinta-2);font-size:10pt">' +
            esc(detalle) + "</p>" +
          '<p style="text-align:center;margin-top:6mm;font-size:10pt">Puntaje obtenido: ' +
            cert.puntaje + " de " + cert.maximo + "</p>" +
          '<p style="text-align:center;margin-top:12mm;font-size:10pt">' + esc(cert.fecha) + "</p>" +
          '<div style="position:absolute;left:0;right:0;bottom:10mm;text-align:center">' +
            '<div class="codigo">' + esc(cert.codigo) + "</div>" +
            '<div style="font-size:8pt;color:var(--ac-tinta-3);margin-top:2mm">' + verif + "</div>" +
          "</div>" +

      return { certificado: cert, titulo: titulo };
    },

    /** Conecta los tres controles de la barra superior. */
    enlazarAcciones(cert, titulo) {
      const li = document.querySelector("#btn-li");
      if (li) li.href = AC.Certificado.urlLinkedIn(cert, titulo);
      const js = document.querySelector("#btn-json");
